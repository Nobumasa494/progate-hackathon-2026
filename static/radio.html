<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深夜ラジオ - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  /* この画面だけ、背景をイラストに差し替える */
  body{
    background-image:linear-gradient(rgba(243,248,244,0.55), rgba(243,248,244,0.55)), url("images/radio-bg.jpg");
    background-repeat:no-repeat;
    background-size:auto, cover;
    background-position:center, center;
    background-attachment:fixed, fixed;
  }
  :root{
    --radioA: oklch(52% 0.14 300); --radioA-bg: oklch(93% 0.05 300);
    --radioB: oklch(52% 0.14 350); --radioB-bg: oklch(93% 0.05 350);
    --onair: oklch(55% 0.18 25);
  }
  body{font-family:'Zen Kaku Gothic New',sans-serif;}

  .stage{
    position:relative;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg, #f4f4f6 0%, #ffffff 62%, #ffffff 100%);
    padding:22px 10px 0;
  }
  .stage-floor{position:absolute;left:0;right:0;bottom:0;height:1px;background:#e5e5ea;}
  .dj-row{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:0;}
  .dj-chip{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;}

  .stage.talking .dj-chip.a .dj-avatar-img{animation:dj-talk-a 1.1s ease-in-out infinite;}
  .stage.talking .dj-chip.b .dj-avatar-img{animation:dj-talk-b 1.1s ease-in-out infinite;}
  @keyframes dj-talk-a{
    0%,100%{transform:scaleX(-1) translateY(0) rotate(0deg);}
    25%{transform:scaleX(-1) translateY(-4px) rotate(-2deg);}
  }
  @keyframes dj-talk-b{
    0%,50%{transform:translateY(0) rotate(0deg);}
    75%{transform:translateY(-4px) rotate(2deg);}
  }
  .dj-chip.a{margin-right:-14px;}
  .dj-chip.b{margin-left:-14px;}
  .dj-avatar-img{width:110px;height:auto;display:block;}
  .dj-avatar-img.face-right{transform:scaleX(-1);}
  .dj-ground{width:70px;height:12px;border-radius:50%;background:radial-gradient(closest-side, rgba(0,0,0,0.16), transparent);margin-top:-6px;}
  .talk-bubbles{flex:0 0 auto;color:#dcdce2;display:flex;align-items:center;margin-bottom:40px;}
  .talk-bubbles.active{color:var(--radioA);}
  .talk-bubbles svg{width:22px;height:22px;}
  .talk-bubbles .b-dot{fill:var(--radioB);}
  .talk-bubbles.active .b-dot{fill:var(--radioB);}
  .talk-bubbles .a-dot{fill:currentColor;}
  .talk-bubbles .dot-pulse{opacity:0.3;}
  .talk-bubbles.active .dot-pulse{animation:dotfade 1.2s infinite;}
  .talk-bubbles.active .dot-pulse:nth-child(2){animation-delay:.2s;}
  .talk-bubbles.active .dot-pulse:nth-child(3){animation-delay:.4s;}
  @keyframes dotfade{0%,100%{opacity:0.25;}50%{opacity:1;}}

  .wave{display:flex;align-items:flex-end;gap:3px;height:22px;}
  .wave span{width:3px;background:var(--radioA);border-radius:2px;height:5px;opacity:0.25;transition:opacity .3s;}
  .wave span:nth-child(even){background:var(--radioB);}
  .wave.playing span{opacity:1;animation:bounce 0.9s ease-in-out infinite;}
  .wave span:nth-child(1){animation-delay:0s;} .wave span:nth-child(2){animation-delay:.1s;}
  .wave span:nth-child(3){animation-delay:.2s;} .wave span:nth-child(4){animation-delay:.3s;}
  .wave span:nth-child(5){animation-delay:.15s;} .wave span:nth-child(6){animation-delay:.25s;}
  .wave span:nth-child(7){animation-delay:.05s;} .wave span:nth-child(8){animation-delay:.35s;}
  .wave span:nth-child(9){animation-delay:.2s;} .wave span:nth-child(10){animation-delay:.1s;}
  @keyframes bounce{0%,100%{height:5px;}50%{height:20px;}}

  #generating-stage img{animation:stage-bounce 1s ease-in-out infinite;}
  @keyframes stage-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

  .onair-dot{width:8px;height:8px;border-radius:50%;background:#c8c8ce;transition:background .3s,box-shadow .3s;}
  .onair.live .onair-dot{background:var(--onair);box-shadow:0 0 8px 1px color-mix(in oklch, var(--onair) 60%, transparent);animation:pulse 1.4s infinite;}
  .onair.live{color:var(--onair)!important;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .btn-radio{background:var(--radioA);border-color:var(--radioA);color:#fff;}
  .btn-radio:hover{background:color-mix(in oklch, var(--radioA) 85%, black);border-color:var(--radioA);color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="navbar" id="nav"></div>

  <div class="appbar">
    <div class="appbar-icon" style="padding:0;overflow:hidden;">
      <img src="images/nav/radio.png" alt="パンダのアイコン" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="appbar-title">深夜ラジオ</div>
  </div>
  <div style="background:rgba(255,255,255,0.7);border-radius:16px;padding:10px 12px;margin-bottom:14px;">
    <h1 style="margin-bottom:6px;">あなただけの深夜ラジオ</h1>
    <p class="sub" style="margin-bottom:0;">今日の記録をもとに、2人のDJがあなたの話で盛り上がっています</p>
  </div>

  <a href="/discover" class="btn btn-ghost" style="width:100%;display:block;text-align:center;text-decoration:none;margin-bottom:16px;">みんなのエピソードを見る ›</a>

  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="onair d-inline-flex align-items-center gap-2 text-secondary small font-monospace" id="onair">
          <span class="onair-dot"></span><span id="onair-label">STANDBY</span>
        </span>
        <span class="text-secondary small font-monospace">FM 89.7 深夜ラジオ</span>
      </div>

      <div class="stage mb-3" id="stage">
        <div class="dj-row">
          <div class="dj-chip a">
            <img class="dj-avatar-img face-right" id="dj-a-img" src="images/zundamon.png" alt="DJ A">
            <div class="dj-ground"></div>
            <span class="badge rounded-pill text-bg-light border" id="dj-a-name">DJ A</span>
          </div>

          <div class="talk-bubbles" id="talk-bubbles">
            <svg viewBox="0 0 24 24">
              <circle class="dot-pulse a-dot" cx="6" cy="12" r="2.4"/>
              <circle class="dot-pulse" cx="12" cy="12" r="2.4" fill="#c8c8ce"/>
              <circle class="dot-pulse b-dot" cx="18" cy="12" r="2.4"/>
            </svg>
          </div>

          <div class="dj-chip b">
            <img class="dj-avatar-img" id="dj-b-img" src="images/metan.png" alt="DJ B">
            <div class="dj-ground"></div>
            <span class="badge rounded-pill text-bg-light border" id="dj-b-name">DJ B</span>
          </div>
        </div>
        <div class="stage-floor"></div>
      </div>

      <div class="wave mb-3" id="wave">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <audio id="player" controls class="w-100 mb-3"></audio>

      <button class="btn btn-radio w-100 fw-bold" id="listen-btn" style="display:none;">今日のラジオを聴く</button>
      <div id="generating-stage" style="display:none;text-align:center;padding:10px 0;">
        <img src="images/friends-stage.png" alt="生成中" style="width:100%;max-width:320px;">
      </div>
      <p id="cta-message" class="text-secondary small mt-2 mb-0"></p>
    </div>
  </div>

  <div class="card shadow-sm border-0 mb-3" id="player-area" style="display:none;">
    <div class="card-body">
      <a id="download-link" class="btn btn-outline-secondary btn-sm mb-3" download="radio-episode.wav">この音声を保存する</a>

      <div id="share-form" class="mb-3">
        <label class="form-label small fw-bold text-secondary d-block mb-1">みんなに共有する(任意)</label>
        <input id="share-name" class="form-control form-control-sm mb-2" type="text" maxlength="30" placeholder="表示名(空欄なら匿名)">
        <textarea id="share-comment" class="form-control form-control-sm mb-2" rows="2" maxlength="200" placeholder="ひとこと(任意)"></textarea>
        <button id="share-btn" class="btn btn-outline-secondary btn-sm">この回を共有する</button>
      </div>
      <div id="shared-info" class="mb-3" style="display:none;">
        <span class="badge text-bg-light border">共有済み(公開中)</span>
        <p id="shared-summary" class="text-secondary small mt-2 mb-0"></p>
      </div>

      <p class="text-secondary small">
        ※共有すると、体重や食事内容も含めて誰でも聞けるようになります。表示名・ひとことは空欄のままでも共有できます(その場合は匿名で公開されます)。
      </p>
      <h3 class="h6 fw-bold">台本</h3>
      <div class="bg-light rounded p-3 small text-secondary" id="script-text" style="white-space:pre-wrap;max-height:260px;overflow-y:auto;"></div>
    </div>
  </div>

</div>

<script src="nav.js"></script>
<script>
renderNav("radio");

const listenBtn = document.getElementById("listen-btn");
const ctaMessage = document.getElementById("cta-message");
const generatingStage = document.getElementById("generating-stage");
const playerArea = document.getElementById("player-area");
const player = document.getElementById("player");
const downloadLink = document.getElementById("download-link");
const shareForm = document.getElementById("share-form");
const shareNameInput = document.getElementById("share-name");
const shareCommentInput = document.getElementById("share-comment");
const shareBtn = document.getElementById("share-btn");
const sharedInfo = document.getElementById("shared-info");
const sharedSummary = document.getElementById("shared-summary");
let currentEpisodeId = null;
const scriptText = document.getElementById("script-text");
const onairEl = document.getElementById("onair");
const onairLabel = document.getElementById("onair-label");
const waveEl = document.getElementById("wave");
const talkBubblesEl = document.getElementById("talk-bubbles");
const stageEl = document.getElementById("stage");

function setOnAir(live, label) {
  onairEl.classList.toggle("live", live);
  onairLabel.textContent = label;
}

player.addEventListener("play", () => {
  waveEl.classList.add("playing");
  talkBubblesEl.classList.add("active");
  stageEl.classList.add("talking");
  setOnAir(true, "ON AIR");
});
player.addEventListener("pause", () => {
  waveEl.classList.remove("playing");
  talkBubblesEl.classList.remove("active");
  stageEl.classList.remove("talking");
  setOnAir(false, "STANDBY");
});
player.addEventListener("ended", () => {
  waveEl.classList.remove("playing");
  talkBubblesEl.classList.remove("active");
  stageEl.classList.remove("talking");
  setOnAir(false, "STANDBY");
  hasPlayedOnce = true;
  renderCta();
});

async function loadLatest() {
  const res = await fetch("/radio/latest");
  const data = await res.json();
  if (!data.episode) {
    playerArea.style.display = "none";
    return;
  }
  playerArea.style.display = "block";
  player.src = data.episode.audio_url;
  downloadLink.href = data.episode.audio_url;
  scriptText.textContent = data.episode.script;

  currentEpisodeId = data.episode.id;
  shareForm.style.display = data.episode.is_shared ? "none" : "block";
  sharedInfo.style.display = data.episode.is_shared ? "block" : "none";
  if (data.episode.is_shared) {
    const name = data.episode.shared_display_name || "匿名";
    const comment = data.episode.shared_comment;
    sharedSummary.textContent = comment ? `${name}: ${comment}` : `${name}として公開中`;
  }
}

shareBtn.addEventListener("click", async () => {
  if (!currentEpisodeId) return;
  if (!confirm("この回を、誰でも聞けるように共有します。よろしいですか?")) return;
  await fetch("/radio/share", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      episode_id: currentEpisodeId,
      display_name: shareNameInput.value.trim(),
      comment: shareCommentInput.value.trim(),
    }),
  });
  await loadLatest();
});

// このページには「作る」ボタンはもう無い。ラジオを作る入り口は食事ログ画面(/record)だけ。
// ここは「今、どういう状態か」を表示し、できていれば聴けるようにするだけの画面。
let hasEpisodeToday = false;
let hasPlayedOnce = false;
let currentStatus = null;

function renderCta() {
  if (!currentStatus) return;

  if (currentStatus.generating) {
    listenBtn.style.display = "none";
    generatingStage.style.display = "block";
    ctaMessage.textContent = "生成中です。1〜2分ほどかかります...";
    return;
  }
  generatingStage.style.display = "none";

  if (!hasEpisodeToday) {
    listenBtn.style.display = "none";
    if (currentStatus.reached_daily_limit) {
      ctaMessage.textContent = "今日の生成回数の上限に達しました。";
    } else {
      ctaMessage.innerHTML = 'まだ何も作っていません。<a href="/record">食事ログ</a>を記録してください。';
    }
    return;
  }

  // 今日の分はもう出来ている
  listenBtn.style.display = "block";
  listenBtn.textContent = hasPlayedOnce ? "もう一度聴く" : "今日のラジオを聴く";
  ctaMessage.innerHTML = hasPlayedOnce
    ? '新しいラジオを聞きたい場合は、<a href="/record">新しく記録して</a>ください。'
    : "";
}

listenBtn.addEventListener("click", () => {
  playerArea.scrollIntoView({ behavior: "smooth", block: "start" });
  player.currentTime = 0;
  player.play();
});

// 食事ログ記録がきっかけで裏で生成が走っているかどうかを、定期的に確認する。
// 生成が終わった瞬間に最新のエピソードを読み込み直す。
let wasGenerating = false;
async function pollStatus() {
  const res = await fetch("/radio/status");
  const status = await res.json();
  currentStatus = status;

  hasEpisodeToday = status.has_episode_today;
  if (status.generating) setOnAir(true, "REC");
  else if (!player.paused === false && player.currentTime === 0) setOnAir(false, "STANDBY");

  if (wasGenerating && !status.generating) {
    hasPlayedOnce = false; // 新しい回ができたので、また「聴く」からやり直し
    await loadLatest();
  }
  wasGenerating = status.generating;

  renderCta();
}

// ニックネームを設定済みなら、共有時の表示名欄に自動で入れておく
// (わざわざ入力し直さなくていいように。空欄のままにすれば匿名で共有できる)
async function prefillShareName() {
  try {
    const res = await fetch("/profile/data");
    if (!res.ok) return;
    const profile = await res.json();
    if (profile.nickname) shareNameInput.value = profile.nickname;
  } catch (e) {
    // 取れなくても共有機能自体は手入力で使えるので、致命的エラーにしない
  }
}

// キャラクター名 → 立ち絵画像。素材が無いキャラはデフォルト画像のまま表示する
// (VOICEVOXの話者は種類が多く、全員分の絵を今は用意できていないため)。
const DJ_IMAGES = {
  "ずんだもん": "images/zundamon.png",
  "四国めたん": "images/metan.png",
  "春日部つむぎ": "images/tsumugi.png",
  "雨晴はう": "images/hau.png",
  "波音リツ": "images/ritsu.png",
  "青山龍星": "images/aoyama.png",
};

// 設定画面で選んだDJのキャラクター名を、「DJ A」「DJ B」の代わりに表示する。
// 話者一覧(/radio/voices)はVOICEVOXの起動待ちで時間がかかることがあるため、
// profile.htmlのpollVoicesと同じ考え方で、届くまで少し待ってから反映する。
async function loadDjNames(attempt = 0) {
  try {
    const profileRes = await fetch("/profile/data");
    if (!profileRes.ok) return;
    const profile = await profileRes.json();

    const voicesRes = await fetch("/radio/voices");
    const status = await voicesRes.json();
    if (status.status !== "ready") {
      // VOICEVOXが起動待ちのことがあるため、少しだけ待って再試行する(最大3回)
      if (attempt < 3) setTimeout(() => loadDjNames(attempt + 1), 5000);
      return;
    }

    const findName = (styleId) => {
      for (const speaker of status.speakers) {
        for (const style of speaker.styles) {
          if (style.id === styleId) return speaker.name;
        }
      }
      return null;
    };

    const nameA = findName(profile.voice_a_id);
    const nameB = findName(profile.voice_b_id);
    if (nameA) {
      document.getElementById("dj-a-name").textContent = nameA;
      if (DJ_IMAGES[nameA]) document.getElementById("dj-a-img").src = DJ_IMAGES[nameA];
    }
    if (nameB) {
      document.getElementById("dj-b-name").textContent = nameB;
      if (DJ_IMAGES[nameB]) document.getElementById("dj-b-img").src = DJ_IMAGES[nameB];
    }
  } catch (e) {
    // 取れなくても再生自体はできるので、致命的エラーにしない(「DJ A」「DJ B」のまま表示)
  }
}

loadLatest();
pollStatus();
prefillShareName();
loadDjNames();
setInterval(pollStatus, 5000);
</script>
</body>
</html>
