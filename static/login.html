<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  body{
    min-height:100vh;display:flex;align-items:center;
    background:radial-gradient(circle at 15% 15%, rgba(46,125,79,0.12), transparent 45%),
               radial-gradient(circle at 85% 85%, rgba(124,92,191,0.10), transparent 45%),
               var(--bg);
  }
  .authwrap{max-width:380px;margin:0 auto;padding:0 24px;width:100%;}
  .auth-logo{width:56px;height:56px;border-radius:18px;background:var(--ai-gradient);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 26px -10px rgba(115,87,196,0.5);}
  .authcard{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:34px 28px;text-align:center;}
  .authcard h1{margin:0 0 6px;}
  .authcard .sub{margin:0 0 24px;}
  .form-control{border-radius:999px;padding:12px 18px;margin-bottom:14px;border:1.5px solid var(--border);background:var(--surface-2);}
  .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 0.2rem rgba(115,87,196,0.15);}
  .switch{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-dim);}
</style>
</head>
<body>
<div class="authwrap">
  <div class="auth-logo" style="overflow:hidden;">
    <img src="images/app-icon.png" alt="アプリアイコン" style="width:100%;height:100%;object-fit:cover;">
  </div>
  <div class="authcard">
    <h1>おかえりなさい</h1>
    <p class="sub">メールアドレスとパスワードを入力してください</p>

    <input class="form-control" id="email" type="email" placeholder="メールアドレス">
    <input class="form-control" id="password" type="password" placeholder="パスワード">
    <button class="btn ai-glow-btn w-100 fw-bold py-2" id="login-btn" style="border-radius:999px;">ログイン</button>

    <p id="error" class="error mt-3 mb-0" style="display:none;"></p>

    <div class="switch">アカウントが無い方は <a href="/signup">新規登録</a></div>
  </div>
</div>

<script>
document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";

  if (!email || !password) return;

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });

  if (res.ok) {
    window.location.href = "/";
  } else {
    const data = await res.json();
    errorEl.textContent = data.error || "ログインに失敗しました";
    errorEl.style.display = "block";
  }
});
</script>
</body>
</html>
