<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{
    min-height:100vh;display:flex;align-items:center;
    background:radial-gradient(circle at 15% 15%, rgba(46,125,79,0.12), transparent 45%),
               radial-gradient(circle at 85% 85%, rgba(124,92,191,0.10), transparent 45%),
               var(--bg);
  }
  .authwrap{max-width:380px;margin:0 auto;padding:0 24px;width:100%;}
  .auth-logo{width:56px;height:56px;border-radius:18px;background:var(--ai-gradient);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 26px -10px rgba(46,125,79,0.5);}
  .authcard{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:34px 28px;text-align:center;}
  .authcard h1{margin:0 0 6px;}
  .authcard .sub{margin:0 0 24px;}
  .form-control{border-radius:999px;padding:12px 18px;margin-bottom:14px;border:1.5px solid var(--border);background:var(--surface-2);}
  .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 0.2rem rgba(46,125,79,0.15);}
  .switch{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-dim);}
</style>
</head>
<body>
<div class="authwrap">
  <div class="auth-logo">
    <svg viewBox="0 0 20 20" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9h14a7 7 0 0 1-14 0Z"/><path d="M6 9c0-2 .5-3.5 1.5-4.5M13.5 4.5C14.5 5.5 15 7 15 9"/></svg>
  </div>
  <div class="authcard">
    <div class="ai-badge mb-3">
      <svg class="sparkle" width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2l1.6 5.4L17 9l-5.4 1.6L10 16l-1.6-5.4L3 9l5.4-1.6Z"/></svg>
      かるレシピ
    </div>
    <h1>おかえりなさい</h1>
    <p class="sub">メールアドレスとパスワードを入力してください</p>

    <input class="form-control" id="email" type="email" placeholder="メールアドレス">
    <input class="form-control" id="password" type="password" placeholder="パスワード">
    <button class="btn ai-glow-btn w-100 fw-bold py-2" id="login-btn" style="border-radius:999px;">ログイン</button>

    <p id="error" class="error mt-3 mb-0" style="display:none;"></p>

    <div class="switch">アカウントが無い方は <a href="/signup">新規登録</a></div>
  </div>
</div>

<script>
document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";

  if (!email || !password) return;

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });

  if (res.ok) {
    window.location.href = "/";
  } else {
    const data = await res.json();
    errorEl.textContent = data.error || "ログインに失敗しました";
    errorEl.style.display = "block";
  }
});
</script>
</body>
</html>
