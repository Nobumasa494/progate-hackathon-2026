<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>目標 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .goalmeta{font-size:13px;color:var(--ink-dim);margin-bottom:18px;}
  .statrow2{display:flex;gap:14px;flex-wrap:wrap;}
  .stat2{flex:1;min-width:220px;background:var(--goal-bg);border-radius:14px;padding:18px 20px;}
  .stat2 .k{font-size:12px;color:var(--ink-dim);margin-bottom:4px;}
  .stat2 .v{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:26px;color:var(--goal);}
  .banner{border-radius:14px;padding:14px 18px;font-size:14px;font-weight:700;margin-top:18px;}
  .toast{margin-top:16px;background:var(--goal-bg);border:1px solid var(--goal);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--goal);font-weight:700;display:none;}
  .toast.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="navbar" id="nav"></div>

  <div class="eyebrow" style="color:var(--goal)">目標</div>
  <h1>あなたの目標</h1>
  <p class="sub">体重の記録から、必要な削減カロリーを自動で計算します</p>

  <div id="goal-area"><p class="loading">読み込み中...</p></div>

  <div class="card">
    <div class="label" style="font-size:13px;color:var(--ink-dim);margin-bottom:10px;font-weight:700;">目標を更新する</div>
    <div class="inputrow">
      <input class="input" id="target-weight" type="number" step="0.1" placeholder="目標体重(kg)">
      <input class="input" id="target-date" type="date">
    </div>
    <button class="btn" id="update-btn" style="background:var(--goal);color:#fff;">目標を更新する</button>
    <div style="font-size:12px;color:var(--ink-dim);margin-top:10px;">現在の体重は入力しません。<a href="/weight-log">体重記録画面</a>の最新の記録が自動で使われます。</div>
    <div class="toast" id="toast">更新しました</div>
  </div>
</div>

<script src="nav.js"></script>
<script>
renderNav("goal");

function renderGoal(goal) {
  const area = document.getElementById("goal-area");
  if (!goal) {
    area.innerHTML = `<div class="card"><p class="sub" style="margin:0;">まだ目標が設定されていません。下のフォームから設定してください。</p></div>`;
    return;
  }
  if (goal.expired) {
    area.innerHTML = `
      <div class="card">
        <div class="goalmeta">${goal.target_weight_kg}kgまで / ${goal.target_date}まで</div>
        <div class="banner" style="background:var(--warn-bg);color:var(--warn);">期日を過ぎています。目標を更新してください。</div>
      </div>
    `;
    return;
  }
  const bannerStyle = goal.is_unsafe_pace
    ? "background:var(--warn-bg);color:var(--warn);"
    : "background:var(--goal-bg);color:var(--goal);";
  const bannerText = goal.is_unsafe_pace
    ? "このペースは少し厳しめです。期日を延ばすか、目標を見直しましょう。レシピ提案は安全な範囲で調整されます。"
    : "順調なペースです。このまま続けましょう。";

  area.innerHTML = `
    <div class="card">
      <div class="goalmeta">${goal.target_weight_kg}kgまで / ${goal.target_date}まで</div>
      <div class="statrow2">
        <div class="stat2"><div class="k">1日の目標削減</div><div class="v">${goal.target_daily_reduction_kcal}kcal</div></div>
        <div class="stat2"><div class="k">ゴールまでの合計</div><div class="v">${goal.total_remaining_kcal}kcal</div></div>
      </div>
      <div class="banner" style="${bannerStyle}">${bannerText}</div>
    </div>
  `;
}

async function loadGoal() {
  try {
    const res = await fetch("/goals/latest?user_id=" + encodeURIComponent(USER_ID));
    if (!res.ok) { renderGoal(null); return; }
    renderGoal(await res.json());
  } catch (e) {
    renderGoal(null);
  }
}

document.getElementById("update-btn").addEventListener("click", async () => {
  const targetWeight = document.getElementById("target-weight").value;
  const targetDate = document.getElementById("target-date").value;
  if (!targetWeight || !targetDate) return;

  const res = await fetch("/goals", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: USER_ID, target_weight_kg: Number(targetWeight), target_date: targetDate }),
  });
  const toast = document.getElementById("toast");
  if (res.ok) {
    toast.textContent = "更新しました";
    await loadGoal();
  } else {
    const err = await res.json();
    toast.textContent = err.error || "更新に失敗しました";
  }
  toast.classList.add("show");
});

loadGoal();
</script>
</body>
</html>
