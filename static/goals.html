<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目標 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  /* この画面だけ、背景をイラストに差し替える */
  body{
    background-image:linear-gradient(rgba(243,248,244,0.55), rgba(243,248,244,0.55)), url("images/goals-bg.jpg");
    background-repeat:no-repeat;
    background-size:auto, cover;
    background-position:center, center;
    background-attachment:fixed, fixed;
  }
  .ring-wrap{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0 18px;}
  .ring-pct{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:26px;fill:var(--primary-dark);}
  .ring-label{font-size:11px;fill:var(--ink-dim);}
  .ring-message{text-align:center;font-size:14px;font-weight:700;color:var(--primary-dark);margin-bottom:4px;}
  .goalmeta{font-size:13px;color:var(--ink-dim);margin-bottom:18px;text-align:center;}
  .statrow2{display:flex;gap:14px;flex-wrap:wrap;}
  .stat2{flex:1;min-width:220px;background:var(--surface-2);border-radius:14px;padding:16px 18px;}
  .stat2 .k{font-size:12px;color:var(--ink-dim);margin-bottom:4px;}
  .stat2 .v{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:22px;color:var(--primary-dark);}
  .banner{border-radius:14px;padding:14px 18px;font-size:13px;font-weight:700;margin-top:14px;display:flex;align-items:center;gap:8px;}
  .toast{margin-top:16px;background:var(--primary-bg);border:1px solid var(--primary);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--primary-dark);font-weight:700;display:none;}
  .toast.show{display:block;}

  .header-area{position:relative;padding-right:78px;min-height:76px;background:rgba(255,255,255,0.7);border-radius:16px;padding-top:10px;padding-bottom:10px;margin-bottom:14px;}
  .header-area p{padding-left:12px;}
  .mascot-shiba{
    position:absolute;right:-10px;top:-16px;width:68px;height:auto;
    animation:mascot-float 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.15));
  }
  @keyframes mascot-float{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-10px) rotate(2deg);}
  }

  .streak-cal-head, .streak-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .streak-cal-head{margin-bottom:6px;font-size:11px;color:var(--ink-dim);font-weight:700;}
  .streak-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;color:var(--ink-dim);background:var(--surface-2);}
  .streak-day.empty{background:none;}
  .streak-day.done{background:var(--primary);color:#fff;font-weight:800;}
  .streak-day.today{border:1.5px solid var(--primary);}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon" style="padding:0;overflow:hidden;">
      <img src="images/nav/goal.png" alt="くまのアイコン" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="appbar-title">目標設定</div>
  </div>

  <div class="header-area">
    <img class="mascot-shiba" src="images/bear.png" alt="くまのベアリー">
    <p class="sub">体重の記録から、必要な削減カロリーを自動で計算します</p>
  </div>

  <a href="/weight-log" class="btn btn-ghost" style="width:100%;display:block;text-align:center;text-decoration:none;margin-bottom:16px;">体重を記録する・グラフを見る ›</a>

  <div id="goal-area"><p class="loading">読み込み中...</p></div>

  <div class="card" id="streak-card">
    <div id="streak-count" style="font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:18px;color:var(--primary-dark);text-align:center;margin-bottom:10px;"></div>
    <div class="streak-cal-head" id="streak-cal-head"></div>
    <div class="streak-cal" id="streak-cal"></div>
  </div>

  <div class="card" id="steps-card">
    <div class="label" style="font-size:13px;color:var(--ink-dim);margin-bottom:10px;font-weight:700;">今週(月曜起点)の歩数</div>
    <div class="statrow2">
      <div class="stat2"><div class="k">今週の歩数合計</div><div class="v" id="weekly-steps">-</div></div>
      <div class="stat2"><div class="k">消費カロリー(概算)</div><div class="v" id="weekly-steps-kcal">-</div></div>
    </div>
    <div style="font-size:12px;color:var(--ink-dim);margin-top:12px;text-align:center;">歩数は<a href="/weight-log">体重記録画面</a>で体重と一緒に記録できます。記録すればするほど目標達成の近道です。</div>
  </div>

  <div class="card">
    <div class="label" style="font-size:13px;color:var(--ink-dim);margin-bottom:10px;font-weight:700;">目標を更新する</div>
    <div class="inputrow">
      <input class="input" id="target-weight" type="number" step="0.1" placeholder="目標体重(kg)">
      <input class="input" id="target-date" type="date">
    </div>
    <button class="btn ai-glow-btn" id="update-btn" style="width:100%;">設定を保存する</button>
    <div style="font-size:12px;color:var(--ink-dim);margin-top:10px;">現在の体重は入力しません。<a href="/weight-log">体重記録画面</a>の最新の記録が自動で使われます。</div>
    <div class="toast" id="toast">更新しました</div>
  </div>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>
renderNav("goal");

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "className") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => node.appendChild(c));
  return node;
}

function fmt(n) {
  return Math.round(n).toLocaleString("ja-JP");
}

function ringSvg(percent) {
  const r = 46, c = 2 * Math.PI * r;
  const offset = c * (1 - percent / 100);
  return `
    <svg width="140" height="140" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--primary)" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 60 60)"/>
      <text x="60" y="56" text-anchor="middle" class="ring-pct">${percent}%</text>
      <text x="60" y="74" text-anchor="middle" class="ring-label">目標達成率</text>
    </svg>
  `;
}

function renderGoal(goal) {
  const area = document.getElementById("goal-area");
  if (!goal) {
    area.innerHTML = `<div class="card"><p class="sub" style="margin:0;">まだ目標が設定されていません。下のフォームから設定してください。</p></div>`;
    return;
  }
  if (goal.expired) {
    area.innerHTML = `
      <div class="card">
        <div class="goalmeta">${goal.target_weight_kg}kgまで / ${goal.target_date}まで</div>
        <div class="banner" style="background:var(--warn-bg);color:var(--warn);">期日を過ぎています。目標を更新してください。</div>
      </div>
    `;
    return;
  }
  const bannerStyle = goal.is_unsafe_pace
    ? "background:var(--warn-bg);color:var(--warn);"
    : "background:var(--primary-bg);color:var(--primary-dark);";
  const bannerText = goal.is_unsafe_pace
    ? "このペースは少し厳しめです。期日を延ばすか、目標を見直しましょう。レシピ提案は安全な範囲で調整されます。"
    : "順調なペースです。このまま続けましょう。";

  area.innerHTML = `
    <div class="card">
      <div class="goalmeta">目標まであと${goal.total_remaining_kcal > 0 ? fmt(goal.total_remaining_kcal) + "kcal" : "達成間近"}(${goal.target_weight_kg}kgまで / ${goal.target_date}まで)</div>
      <div class="statrow2">
        <div class="stat2"><div class="k">1日の目標削減</div><div class="v">${fmt(goal.target_daily_reduction_kcal)}kcal</div></div>
        <div class="stat2"><div class="k">ゴールまでの合計(体重ベース)</div><div class="v">${fmt(goal.total_remaining_kcal)}kcal</div></div>
      </div>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:6px;">※ 今の体重をもとに毎回計算し直しています。体重が変わるとここも変わります。</div>
      <div class="banner" style="${bannerStyle}">${bannerText}</div>
    </div>
    <div class="card" id="progress-area"><p class="loading">食事ログの進捗を読み込み中...</p></div>
  `;
  loadProgress();
}

function renderProgress(progress) {
  const area = document.getElementById("progress-area");
  if (!area) return;
  const remainingText = progress.remaining_kcal === null
    ? "-"
    : `${fmt(progress.remaining_kcal)}kcal`;
  area.innerHTML = `
    <div class="ring-wrap" id="ring-wrap">
      ${ringSvg(0)}
      <img src="images/elephant.png" alt="ゾウのアイコン" style="width:56px;height:auto;">
    </div>
    <div class="goalmeta">食事ログの進捗(行動ベース)</div>
    <div class="statrow2">
      <div class="stat2"><div class="k">今の目標での削減実績</div><div class="v">${fmt(progress.current_goal_saved_kcal)}kcal</div></div>
      <div class="stat2"><div class="k">今の目標まであと</div><div class="v">${remainingText}</div></div>
    </div>
    <div style="font-size:11px;color:var(--ink-dim);margin-top:6px;">※ 目標を設定した時点を基準に、記録した実績だけで計算しています。</div>
    <div style="font-size:12px;color:var(--ink-dim);margin-top:12px;text-align:center;">通算(全期間)の削減実績: ${fmt(progress.all_time_saved_kcal)}kcal</div>
  `;

  // 達成率のリングを、行動ベースの進捗(saved / (saved + remaining))で更新する
  const ringWrap = document.getElementById("ring-wrap");
  if (ringWrap && progress.remaining_kcal !== null) {
    const total = progress.current_goal_saved_kcal + progress.remaining_kcal;
    const percent = total > 0 ? Math.max(0, Math.min(100, Math.round((progress.current_goal_saved_kcal / total) * 100))) : 0;
    ringWrap.innerHTML = `
      ${ringSvg(percent)}
      <img src="images/elephant.png" alt="ゾウのアイコン" style="width:56px;height:auto;">
    `;
  }
}

async function loadProgress() {
  try {
    const res = await fetch("/progress");
    if (!res.ok) return;
    renderProgress(await res.json());
  } catch (e) {
    // 進捗の読み込み失敗は致命的ではないので、目標自体の表示は残す
  }
}

const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];

function renderStreakCalendar(streakDays, dateSet) {
  const head = document.getElementById("streak-cal-head");
  head.innerHTML = WEEKDAY_LABELS.map(d => `<div>${d}</div>`).join("");

  const countEl = document.getElementById("streak-count");
  countEl.textContent = streakDays > 0 ? `🔥 ${streakDays}日連続で置き換え中!` : "まだ連続記録がありません";

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth(); // 0-indexed
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = today.toISOString().slice(0, 10);

  const cal = document.getElementById("streak-cal");
  cal.innerHTML = "";
  for (let i = 0; i < firstDay.getDay(); i++) {
    cal.appendChild(el("div", { className: "streak-day empty" }));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const classes = ["streak-day"];
    if (dateSet.has(dateStr)) classes.push("done");
    if (dateStr === todayStr) classes.push("today");
    cal.appendChild(el("div", { className: classes.join(" "), text: `${d}` }));
  }
}

async function loadStreak() {
  try {
    const res = await fetch("/streak");
    if (!res.ok) return;
    const data = await res.json();
    renderStreakCalendar(data.streak_days, new Set(data.dates));
  } catch (e) {
    // 取れなくても目標画面自体は使えるようにする(致命的エラーにしない)
  }
}

async function loadGoal() {
  try {
    const res = await fetch("/goals/latest");
    if (!res.ok) { renderGoal(null); return; }
    renderGoal(await res.json());
  } catch (e) {
    renderGoal(null);
  }
}

document.getElementById("update-btn").addEventListener("click", async () => {
  const targetWeight = document.getElementById("target-weight").value;
  const targetDate = document.getElementById("target-date").value;
  if (!targetWeight || !targetDate) return;

  const res = await fetch("/goals", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ target_weight_kg: Number(targetWeight), target_date: targetDate }),
  });
  const toast = document.getElementById("toast");
  if (res.ok) {
    toast.textContent = "更新しました";
    await loadGoal();
  } else {
    const err = await res.json();
    toast.textContent = err.error || "更新に失敗しました";
  }
  toast.classList.add("show");
});

async function loadSteps() {
  try {
    const res = await fetch("/weight/steps/weekly");
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById("weekly-steps").textContent = fmt(data.total_steps) + "歩";
    document.getElementById("weekly-steps-kcal").textContent =
      data.kcal !== null && data.kcal !== undefined ? `${fmt(data.kcal)}kcal` : "体重記録後に表示";
  } catch (e) {
    // 歩数が取れなくても、目標画面自体は使えるようにする
  }
}

loadGoal();
loadStreak();
loadSteps();
</script>
</body>
</html>
