<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランキング - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  .rank-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .rank-row:last-child{border-bottom:none;}
  .rank-row.is-me{background:var(--primary-bg);border-radius:12px;padding-left:10px;padding-right:10px;}
  .rank-number{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:16px;color:var(--ink-dim);width:28px;flex:0 0 auto;text-align:center;}
  .rank-nickname{flex:1;font-weight:700;font-size:14px;}
  .rank-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
  .rank-badges{font-size:13px;color:var(--ink-dim);flex:0 0 auto;}
  .rating-grey{background:#9e9e9e;} .rating-brown{background:#8d6e63;} .rating-green{background:#2e7d4f;}
  .rating-cyan{background:#00acc1;} .rating-blue{background:#3949ab;} .rating-yellow{background:#c9a227;}
  .rating-orange{background:#ef6c00;} .rating-red{background:#c62828;}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon" style="padding:0;overflow:hidden;">
      <img src="images/lion.png" alt="ライオンのアイコン" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="appbar-title">ランキング</div>
  </div>

  <h1>みんなのレーティング</h1>
  <p class="sub">ニックネーム・開拓者バッジ数はみんなに公開されます</p>

  <div class="card" id="leaderboard-card">
    <p class="sub" id="loading">読み込み中...</p>
  </div>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>
renderNav("logs");

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "className") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => node.appendChild(c));
  return node;
}

const RATING_HEX = {
  grey: "#9e9e9e", brown: "#8d6e63", green: "#2e7d4f", cyan: "#00acc1",
  blue: "#3949ab", yellow: "#c9a227", orange: "#ef6c00", red: "#c62828",
};

async function load() {
  const card = document.getElementById("leaderboard-card");
  try {
    const res = await fetch("/leaderboard/data");
    const entries = await res.json();
    card.innerHTML = "";

    if (entries.length === 0) {
      card.appendChild(el("p", { className: "sub", text: "まだ誰もレーティングがありません。" }));
      return;
    }

    const MEDALS = ["🥇", "🥈", "🥉"];
    entries.forEach((e, i) => {
      const row = el("div", { className: `rank-row${e.is_me ? " is-me" : ""}` });
      const rankText = MEDALS[i] || `${i + 1}`;
      row.appendChild(el("div", { className: "rank-number", text: rankText }));

      const nameWrap = el("div", { className: "rank-nickname" });
      nameWrap.appendChild(el("span", { className: "rank-dot", style: `background:${RATING_HEX[e.color]};` }));
      nameWrap.appendChild(document.createTextNode(`${e.nickname}${e.is_me ? "(あなた)" : ""} ${e.rating}`));
      row.appendChild(nameWrap);

      row.appendChild(el("div", { className: "rank-badges", text: e.badges > 0 ? `🏆×${e.badges}` : "" }));
      card.appendChild(row);
    });
  } catch (err) {
    card.innerHTML = "";
    card.appendChild(el("p", { className: "error", text: "ランキングの取得に失敗しました。" }));
  }
}

load();
</script>
</body>
</html>
