<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>食事ログ記録 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .suggest-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--primary-bg);border-radius:16px;padding:18px 20px;margin-bottom:16px;}
  .suggest-name{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:18px;color:var(--primary-dark);}
  .suggest-tag{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .suggest-kcal{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:20px;color:var(--primary-dark);}
  .label{font-size:13px;color:var(--ink-dim);margin-bottom:10px;font-weight:700;}
  .choices{display:flex;gap:10px;margin-bottom:20px;}
  .choice{flex:1;text-align:center;padding:16px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--ink-dim);}
  .choice.active{background:var(--primary);color:#fff;}
  .confirm{background:var(--primary-bg);border-radius:14px;padding:16px 20px;color:var(--primary-dark);font-weight:700;font-size:14px;margin-top:20px;display:none;}
  .confirm.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3.5" width="12" height="14" rx="1.8"/><path d="M7 10.5l2 2 4-4.5"/></svg>
    </div>
    <div class="appbar-title">食事ログ</div>
  </div>

  <h1>実際に食べましたか?</h1>
  <p class="sub">最新の提案をもとに、実際に食べた内容を記録します</p>

  <div id="suggest-area"><p class="loading">最新の提案を読み込み中...</p></div>

  <div class="card" id="form-area" style="display:none;">
    <div class="label">実際はどうでしたか?</div>
    <div class="choices">
      <div class="choice active" id="choice-replaced">置き換えた</div>
      <div class="choice" id="choice-kept">我慢して元のを食べた</div>
    </div>
    <div class="label">実際に食べたカロリー</div>
    <input class="input" id="actual-cal" type="number" style="max-width:160px;">

    <div class="mb-2" style="margin-top:16px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-dim);">
        <input type="checkbox" id="want-radio">
        この記録から、今日のラジオも作る
      </label>
    </div>

    <div id="diary-note-area" style="display:none;">
      <div class="label">今日、DJたちに教えたいことある?</div>
      <textarea id="diary-note" class="form-control" rows="2" placeholder="面白かったこと、愚痴りたいこと、なんでも(必須)"></textarea>
      <div id="diary-error" class="error" style="display:none;margin-top:6px;">今日、DJたちに教えたいことを入力してください。</div>
    </div>

    <br>
    <button class="btn" id="record-btn" style="width:100%;">記録する</button>
    <div class="confirm" id="confirm"></div>
  </div>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>
renderNav("logs");

let suggestion = null;

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "className") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => node.appendChild(c));
  return node;
}

async function loadSuggestion() {
  const area = document.getElementById("suggest-area");
  try {
    const res = await fetch("/suggestions/latest");
    if (!res.ok) {
      area.innerHTML = `<p class="error">まだ提案がありません。まず<a href="/recipe">レシピ提案画面</a>で料理を検索してください。</p>`;
      return;
    }
    suggestion = await res.json();

    area.innerHTML = "";
    const suggestCard = el("div", { className: "suggest-card" });
    const left = el("div");
    left.appendChild(el("div", { className: "suggest-name", text: suggestion.suggested_replacement_name }));
    left.appendChild(el("div", { className: "suggest-tag", text: `元の提案: ${suggestion.dish_name}(${suggestion.original_calories}kcal)` }));
    suggestCard.appendChild(left);
    suggestCard.appendChild(el("div", { className: "suggest-kcal", text: `${suggestion.replacement_calories}kcal` }));
    area.appendChild(suggestCard);

    const detailCard = el("div", { className: "card" });
    detailCard.style.marginBottom = "16px";
    detailCard.appendChild(el("h3", { className: "sec", text: "材料", style: "margin-top:0;" }));
    const ul = el("ul");
    suggestion.ingredients.forEach(i => ul.appendChild(el("li", { text: `${i.name} ${i.amount}` })));
    detailCard.appendChild(ul);
    detailCard.appendChild(el("h3", { className: "sec", text: "作り方" }));
    const ol = el("ol");
    suggestion.steps.forEach(s => ol.appendChild(el("li", { text: s })));
    detailCard.appendChild(ol);
    area.appendChild(detailCard);

    document.getElementById("form-area").style.display = "block";
    document.getElementById("actual-cal").value = suggestion.replacement_calories;
  } catch (e) {
    area.innerHTML = `<p class="error">読み込みに失敗しました。</p>`;
  }
}

const choiceReplaced = document.getElementById("choice-replaced");
const choiceKept = document.getElementById("choice-kept");
const actualCal = document.getElementById("actual-cal");

choiceReplaced.addEventListener("click", () => {
  choiceReplaced.classList.add("active"); choiceKept.classList.remove("active");
  if (suggestion) actualCal.value = suggestion.replacement_calories;
});
choiceKept.addEventListener("click", () => {
  choiceKept.classList.add("active"); choiceReplaced.classList.remove("active");
  if (suggestion) actualCal.value = suggestion.original_calories;
});

const wantRadioCheckbox = document.getElementById("want-radio");
const diaryNoteArea = document.getElementById("diary-note-area");
const diaryNoteEl = document.getElementById("diary-note");
const diaryErrorEl = document.getElementById("diary-error");

wantRadioCheckbox.addEventListener("change", () => {
  diaryNoteArea.style.display = wantRadioCheckbox.checked ? "block" : "none";
  diaryErrorEl.style.display = "none";
});

document.getElementById("record-btn").addEventListener("click", async () => {
  if (!suggestion) return;

  const wantRadio = wantRadioCheckbox.checked;
  const diaryNote = diaryNoteEl.value.trim();
  if (wantRadio && !diaryNote) {
    diaryErrorEl.style.display = "block";
    diaryNoteEl.focus();
    return;
  }
  diaryErrorEl.style.display = "none";

  const didReplace = choiceReplaced.classList.contains("active");
  const body = {
    dish_name: suggestion.dish_name,
    suggested_replacement_name: suggestion.suggested_replacement_name,
    original_calories: suggestion.original_calories,
    replacement_calories: suggestion.replacement_calories,
    did_replace: didReplace,
    actual_calories: Number(actualCal.value),
    want_radio: wantRadio,
    diary_note: diaryNote,
  };
  const res = await fetch("/meal_logs", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const confirmEl = document.getElementById("confirm");
  if (res.ok) {
    diaryNoteEl.value = "";
    wantRadioCheckbox.checked = false;
    diaryNoteArea.style.display = "none";
    const summaryRes = await fetch("/meal_logs/weekly-summary");
    const summary = await summaryRes.json();
    const thisWeek = summary[0] ? summary[0].total_saved_kcal : 0;
    confirmEl.textContent = wantRadio
      ? `記録しました。今週の削減: ${thisWeek}kcal(ラジオも生成を開始しました)`
      : `記録しました。今週の削減: ${thisWeek}kcal`;
  } else {
    const err = await res.json().catch(() => ({}));
    confirmEl.textContent = err.error || "記録に失敗しました。";
  }
  confirmEl.classList.add("show");
});

loadSuggestion();
</script>
</body>
</html>
