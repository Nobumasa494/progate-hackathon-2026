<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食事ログ記録 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  .suggest-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--primary-bg);border-radius:16px;padding:18px 20px;margin-bottom:16px;}
  .suggest-name{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:18px;color:var(--primary-dark);}
  .suggest-tag{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .suggest-kcal{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:20px;color:var(--primary-dark);}
  .label{font-size:13px;color:var(--ink-dim);margin-bottom:10px;font-weight:700;}
  .choices{display:flex;gap:10px;margin-bottom:20px;}
  .choice{flex:1;text-align:center;padding:16px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--ink-dim);}
  .choice.active{background:var(--primary);color:#fff;}
  .confirm{background:var(--primary-bg);border-radius:14px;padding:16px 20px;color:var(--primary-dark);font-weight:700;font-size:14px;margin-top:20px;display:none;}
  .confirm.show{display:block;}
  .rating-badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:14px;color:#fff;text-decoration:none;}
  .rating-grey{background:#9e9e9e;} .rating-brown{background:#8d6e63;} .rating-green{background:#2e7d4f;}
  .rating-cyan{background:#00acc1;} .rating-blue{background:#3949ab;} .rating-yellow{background:#c9a227;}
  .rating-orange{background:#ef6c00;} .rating-red{background:#c62828;}
  .quiz-card{background:var(--surface-2);border-radius:16px;padding:16px 20px;margin-bottom:16px;}
  .quiz-question{font-weight:700;font-size:14px;margin-bottom:12px;}
  .quiz-choice{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);margin-bottom:8px;cursor:pointer;font-size:13px;}
  .quiz-choice.correct{background:#e0faec;border-color:#22c55e;border-width:2px;box-shadow:0 0 0 3px rgba(34,197,94,0.25);animation:quiz-correct-pop 0.6s cubic-bezier(.34,1.6,.64,1);}
  .quiz-choice.correct::after{content:" ✓";font-weight:800;color:#16a34a;}
  .quiz-choice.wrong{background:var(--warn-bg);border-color:var(--warn);animation:quiz-wrong-shake 0.4s ease;}
  @keyframes quiz-correct-pop{
    0%{transform:scale(1);}
    30%{transform:scale(1.12);}
    55%{transform:scale(0.96);}
    80%{transform:scale(1.03);}
    100%{transform:scale(1);}
  }
  @keyframes quiz-wrong-shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  .quiz-result.show-correct{animation:quiz-result-pop 0.5s cubic-bezier(.34,1.6,.64,1);color:#16a34a;font-size:16px;}
  @keyframes quiz-result-pop{
    0%{transform:scale(0.4);opacity:0;}
    70%{transform:scale(1.1);opacity:1;}
    100%{transform:scale(1);}
  }
  .quiz-result{font-size:13px;font-weight:700;margin-top:8px;}
  .rating-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink-dim);margin-bottom:16px;}
  .rating-legend span{display:inline-flex;align-items:center;gap:3px;}
  .rating-legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .header-area{position:relative;padding-right:98px;min-height:100px;background:rgba(255,255,255,0.7);border-radius:16px;padding-top:10px;padding-bottom:10px;margin-bottom:14px;}
  .header-area h1, .header-area p{padding-left:12px;}
  .mascot-panda{
    position:absolute;right:-10px;top:-4px;width:92px;height:auto;
    animation:mascot-float 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.15));
  }
  @keyframes mascot-float{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-10px) rotate(2deg);}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon" style="padding:0;overflow:hidden;">
      <img src="images/nav/meal.png" alt="うさぎのアイコン" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="appbar-title">食事ログ</div>
  </div>

  <div class="header-area">
    <img class="mascot-panda" src="images/rabbit.png" alt="うさぎのバニー">
    <h1>実際に食べましたか?</h1>
    <p class="sub">最新の提案をもとに、実際に食べた内容を記録します</p>
  </div>

  <div id="rating-badge"></div>
  <div class="rating-legend" id="rating-legend">
    <span><span class="dot" style="background:#9e9e9e;"></span>灰(0〜399)</span>
    <span><span class="dot" style="background:#8d6e63;"></span>茶(400〜799)</span>
    <span><span class="dot" style="background:#2e7d4f;"></span>緑(800〜1199)</span>
    <span><span class="dot" style="background:#00acc1;"></span>水色(1200〜1599)</span>
    <span><span class="dot" style="background:#3949ab;"></span>青(1600〜1999)</span>
    <span><span class="dot" style="background:#c9a227;"></span>黄(2000〜2399)</span>
    <span><span class="dot" style="background:#ef6c00;"></span>橙(2400〜2799)</span>
    <span><span class="dot" style="background:#c62828;"></span>赤(2800〜)</span>
  </div>

  <div id="suggest-area"><p class="loading">最新の提案を読み込み中...</p></div>

  <div id="quiz-area"></div>

  <div class="card" id="form-area" style="display:none;">
    <div class="label">実際はどうでしたか?</div>
    <div class="choices">
      <div class="choice active" id="choice-replaced">置き換えた</div>
      <div class="choice" id="choice-kept">置き換えずに元のを食べた</div>
    </div>
    <div class="label">実際に食べたカロリー</div>
    <input class="input" id="actual-cal" type="number" style="max-width:160px;">

    <div class="mb-2" style="margin-top:16px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-dim);">
        <input type="checkbox" id="want-radio">
        この記録から、今日のラジオも作る
      </label>
    </div>

    <div id="diary-note-area" style="display:none;">
      <div class="label">今日、DJたちに教えたいことある?</div>
      <textarea id="diary-note" class="form-control" rows="2" placeholder="面白かったこと、愚痴りたいこと、なんでも(必須)"></textarea>
      <div id="diary-error" class="error" style="display:none;margin-top:6px;">今日、DJたちに教えたいことを入力してください。</div>
    </div>

    <br>
    <button class="btn ai-glow-btn" id="record-btn" style="width:100%;">記録する</button>
    <div class="confirm" id="confirm"></div>
  </div>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>
renderNav("logs");

let suggestion = null;

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "className") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => node.appendChild(c));
  return node;
}

async function loadRating() {
  try {
    const res = await fetch("/rating");
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById("rating-badge").innerHTML = "";
    const deltaText = data.delta === null ? "" : data.delta > 0 ? ` (▲+${data.delta})` : data.delta < 0 ? ` (▼${data.delta})` : " (→±0)";
    const badge = el("a", {
      className: `rating-badge rating-${data.color}`,
      href: "/leaderboard",
      text: `レーティング ${Math.round(data.rating)}${deltaText} (🏆 ${data.rank}位 / ${data.total}人中) ›`,
    });
    document.getElementById("rating-badge").appendChild(badge);
  } catch (e) {
    // レーティングが取れなくても他の機能は使えるようにする(致命的エラーにしない)
  }
}

function renderQuiz(suggestion) {
  const area = document.getElementById("quiz-area");
  area.innerHTML = "";
  if (!suggestion.trivia_question) return;

  const card = el("div", { className: "quiz-card" });
  card.appendChild(el("div", { className: "quiz-question", text: `🧠 ${suggestion.trivia_question}` }));

  const resultEl = el("div", { className: "quiz-result" });

  suggestion.trivia_choices.forEach(choice => {
    const btn = el("button", { className: "quiz-choice", text: choice });
    btn.addEventListener("click", async () => {
      card.querySelectorAll(".quiz-choice").forEach(b => b.disabled = true);
      const isCorrect = choice === suggestion.trivia_answer;
      btn.classList.add(isCorrect ? "correct" : "wrong");
      resultEl.textContent = isCorrect ? "🎉 正解!" : `不正解。正解は「${suggestion.trivia_answer}」`;
      if (isCorrect) resultEl.classList.add("show-correct");

      await fetch("/quiz/answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: suggestion.trivia_question,
          choice,
          correct_answer: suggestion.trivia_answer,
        }),
      });
    });
    card.appendChild(btn);
  });

  card.appendChild(resultEl);
  area.appendChild(card);
}

async function loadSuggestion() {
  const area = document.getElementById("suggest-area");
  try {
    const res = await fetch("/suggestions/latest");
    if (!res.ok) {
      area.innerHTML = `<p class="error">まだ提案がありません。まず<a href="/recipe">レシピ提案画面</a>で料理を検索してください。</p>`;
      return;
    }
    suggestion = await res.json();

    area.innerHTML = "";
    const suggestCard = el("div", { className: "suggest-card" });
    const left = el("div");
    left.appendChild(el("div", { className: "suggest-name", text: suggestion.suggested_replacement_name }));
    left.appendChild(el("div", { className: "suggest-tag", text: `元の提案: ${suggestion.dish_name}(${suggestion.original_calories}kcal)` }));
    suggestCard.appendChild(left);
    suggestCard.appendChild(el("div", { className: "suggest-kcal", text: `${suggestion.replacement_calories}kcal` }));
    area.appendChild(suggestCard);

    const detailCard = el("div", { className: "card" });
    detailCard.style.marginBottom = "16px";
    detailCard.appendChild(el("h3", { className: "sec", text: "材料", style: "margin-top:0;" }));
    const ul = el("ul");
    suggestion.ingredients.forEach(i => ul.appendChild(el("li", { text: `${i.name} ${i.amount}` })));
    detailCard.appendChild(ul);
    detailCard.appendChild(el("h3", { className: "sec", text: "作り方" }));
    const ol = el("ol");
    suggestion.steps.forEach(s => ol.appendChild(el("li", { text: s })));
    detailCard.appendChild(ol);
    area.appendChild(detailCard);

    // 「探すクエスト」への入り口。新しいナビタブは増やさず、提案の直後だけに表示する。
    // どの食材を探すかは、AIが勝手に1つ選ぶのではなく、本人が自分で選べるようにする
    if (suggestion.ingredients.length > 0) {
      const questCard = el("div", { className: "card", style: "margin-bottom:16px;" });
      questCard.appendChild(el("div", { className: "label", text: "どの食材を探しに行く?(複数選択可)" }));
      const questChoices = el("div", { style: "display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;" });
      const selected = new Set();
      const goBtn = el("a", {
        className: "btn",
        text: "探しに行く",
        style: "width:100%;display:block;text-align:center;text-decoration:none;pointer-events:none;opacity:0.4;",
      });
      const updateGoBtn = () => {
        if (selected.size === 0) {
          goBtn.style.pointerEvents = "none";
          goBtn.style.opacity = "0.4";
          goBtn.removeAttribute("href");
          return;
        }
        const qs = [...selected].map((n) => `dish_name=${encodeURIComponent(n)}`).join("&");
        goBtn.href = `/quest?${qs}`;
        goBtn.style.pointerEvents = "auto";
        goBtn.style.opacity = "1";
      };
      suggestion.ingredients.forEach((i) => {
        const chip = el("button", {
          type: "button",
          className: "btn btn-ghost",
          text: i.name,
          style: "padding:10px 16px;font-size:13px;",
        });
        chip.addEventListener("click", () => {
          if (selected.has(i.name)) {
            selected.delete(i.name);
            chip.classList.remove("btn");
            chip.classList.add("btn-ghost");
          } else {
            selected.add(i.name);
            chip.classList.remove("btn-ghost");
            chip.classList.add("btn");
          }
          updateGoBtn();
        });
        questChoices.appendChild(chip);
      });
      questCard.appendChild(questChoices);
      questCard.appendChild(goBtn);
      area.appendChild(questCard);
    }

    document.getElementById("form-area").style.display = "block";
    document.getElementById("actual-cal").value = suggestion.replacement_calories;
    renderQuiz(suggestion);
  } catch (e) {
    area.innerHTML = `<p class="error">読み込みに失敗しました。</p>`;
  }
}

const choiceReplaced = document.getElementById("choice-replaced");
const choiceKept = document.getElementById("choice-kept");
const actualCal = document.getElementById("actual-cal");

choiceReplaced.addEventListener("click", () => {
  choiceReplaced.classList.add("active"); choiceKept.classList.remove("active");
  if (suggestion) actualCal.value = suggestion.replacement_calories;
});
choiceKept.addEventListener("click", () => {
  choiceKept.classList.add("active"); choiceReplaced.classList.remove("active");
  if (suggestion) actualCal.value = suggestion.original_calories;
});

const wantRadioCheckbox = document.getElementById("want-radio");
const diaryNoteArea = document.getElementById("diary-note-area");
const diaryNoteEl = document.getElementById("diary-note");
const diaryErrorEl = document.getElementById("diary-error");

wantRadioCheckbox.addEventListener("change", () => {
  diaryNoteArea.style.display = wantRadioCheckbox.checked ? "block" : "none";
  diaryErrorEl.style.display = "none";
});

document.getElementById("record-btn").addEventListener("click", async () => {
  if (!suggestion) return;

  const wantRadio = wantRadioCheckbox.checked;
  const diaryNote = diaryNoteEl.value.trim();
  if (wantRadio && !diaryNote) {
    diaryErrorEl.style.display = "block";
    diaryNoteEl.focus();
    return;
  }
  diaryErrorEl.style.display = "none";

  const didReplace = choiceReplaced.classList.contains("active");
  const body = {
    dish_name: suggestion.dish_name,
    suggested_replacement_name: suggestion.suggested_replacement_name,
    original_calories: suggestion.original_calories,
    replacement_calories: suggestion.replacement_calories,
    did_replace: didReplace,
    actual_calories: Number(actualCal.value),
    want_radio: wantRadio,
    diary_note: diaryNote,
  };
  const res = await fetch("/meal_logs", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const confirmEl = document.getElementById("confirm");
  if (res.ok) {
    diaryNoteEl.value = "";
    wantRadioCheckbox.checked = false;
    diaryNoteArea.style.display = "none";
    const summaryRes = await fetch("/meal_logs/weekly-summary");
    const summary = await summaryRes.json();
    const thisWeek = summary[0] ? summary[0].total_saved_kcal : 0;
    confirmEl.textContent = wantRadio
      ? `記録しました。今週の削減: ${thisWeek}kcal(ラジオも生成を開始しました)`
      : `記録しました。今週の削減: ${thisWeek}kcal`;
  } else {
    const err = await res.json().catch(() => ({}));
    confirmEl.textContent = err.error || "記録に失敗しました。";
  }
  confirmEl.classList.add("show");
});

loadSuggestion();
loadRating();
</script>
</body>
</html>
