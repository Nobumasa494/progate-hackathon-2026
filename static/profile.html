<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .label{font-size:13px;color:var(--ink-dim);margin-bottom:10px;font-weight:700;}
  select.input{width:100%;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="navbar" id="nav"></div>

  <div class="eyebrow">設定</div>
  <h1>プロフィール</h1>
  <p class="sub">深夜ラジオ機能(実験中)で使う情報です</p>

  <div class="card">
    <div class="label">好きなこと</div>
    <input class="input" id="favorite-things" type="text" placeholder="例: 映画鑑賞" style="margin-bottom:14px;">

    <div class="label">興味があること</div>
    <input class="input" id="interests" type="text" placeholder="例: 宇宙、心理学" style="margin-bottom:14px;">

    <div class="label">アレルギーがある食材 (レシピ提案時に使います)</div>
    <div id="allergen-list" style="margin-bottom:14px;"></div>

    <div class="label">DJ Aのキャラクター</div>
    <select class="input" id="voice-a"></select>

    <div class="label">DJ Bのキャラクター</div>
    <select class="input" id="voice-b"></select>

    <button class="btn" id="save-btn">保存する</button>
    <p id="saved" class="sub" style="display:none;margin-top:12px;">保存しました。</p>
    <p id="save-error" class="error" style="display:none;margin-top:12px;">保存に失敗しました。</p>
    <p id="voices-error" class="error" style="display:none;margin-top:12px;">
      キャラクター一覧の取得に失敗しました。VOICEVOXエンジンが起動しているか確認してください。
    </p>
  </div>

  <div class="card">
    <button class="btn btn-ghost" id="logout-btn" style="width:100%;">ログアウト</button>
  </div>
</div>

<script src="nav.js"></script>
<script>
renderNav("profile");
document.getElementById("logout-btn").addEventListener("click", logout);

const favoriteThingsInput = document.getElementById("favorite-things");
const interestsInput = document.getElementById("interests");
const voiceASelect = document.getElementById("voice-a");
const voiceBSelect = document.getElementById("voice-b");
const savedEl = document.getElementById("saved");
const saveErrorEl = document.getElementById("save-error");
const voicesErrorEl = document.getElementById("voices-error");
const saveBtn = document.getElementById("save-btn");

// 特定原材料8品目(表示名)
const ALLERGENS = ["えび", "カシューナッツ", "かに", "くるみ", "小麦", "そば", "卵", "乳", "落花生"];
const allergenList = document.getElementById("allergen-list");

function renderAllergenCheckboxes(selected) {
  allergenList.innerHTML = "";
  for (const allergen of ALLERGENS) {
    const label = document.createElement("label");
    label.style.cssText = "display:inline-flex;align-items:center;gap:6px;margin-right:14px;margin-bottom:8px;font-size:14px;";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = allergen;
    checkbox.id = "allergen-" + allergen;
    if (selected.includes(allergen)) checkbox.checked = true;
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(allergen));
    allergenList.appendChild(label);
  }
}

function fillVoiceOptions(select, speakers, selectedId) {
  select.innerHTML = "";
  for (const speaker of speakers) {
    for (const style of speaker.styles) {
      const option = document.createElement("option");
      option.value = style.id;
      option.textContent = `${speaker.name}(${style.name})`;
      if (style.id === selectedId) option.selected = true;
      select.appendChild(option);
    }
  }
}

let profileForVoices = null;

async function load() {
  const profileRes = await fetch("/profile/data");
  const profile = await profileRes.json();
  favoriteThingsInput.value = profile.favorite_things || "";
  interestsInput.value = profile.interests || "";
  renderAllergenCheckboxes(profile.allergens || []);

  // DJキャラクター一覧はVOICEVOXの起動待ちで時間がかかることがあるため、
  // ここでは待たずにポーリングで確認する(pollVoices参照)。
  profileForVoices = profile;
  pollVoices();
}

// VOICEVOXの起動待ちで時間がかかることがあるため、一覧の取得は裏側(/radio/voices)に
// 任せて、ここでは定期的に「もう届いた?」と確認するだけにする(radio.htmlのpollStatusと
// 同じ考え方)。読み込み中・失敗時も画面の他の項目はブロックしない。
async function pollVoices() {
  try {
    const res = await fetch("/radio/voices");
    const status = await res.json();

    if (status.status === "ready") {
      voicesErrorEl.style.display = "none";
      fillVoiceOptions(voiceASelect, status.speakers, profileForVoices.voice_a_id);
      fillVoiceOptions(voiceBSelect, status.speakers, profileForVoices.voice_b_id);
      return; // 取得できたので、ポーリングはここで終了
    }

    if (status.status === "error") {
      voicesErrorEl.style.display = "block";
    }
    // "loading"や"error"の場合は、しばらくしてまた確認する
    setTimeout(pollVoices, 5000);
  } catch (e) {
    voicesErrorEl.style.display = "block";
    setTimeout(pollVoices, 5000);
  }
}

saveBtn.addEventListener("click", async () => {
  savedEl.style.display = "none";
  saveErrorEl.style.display = "none";

  const body = {
    favorite_things: favoriteThingsInput.value.trim(),
    interests: interestsInput.value.trim(),
    allergens: Array.from(allergenList.querySelectorAll("input:checked")).map(c => c.value),
  };
  // 話者一覧がまだ届いておらずプルダウンが空の場合は、voice_a_id/voice_b_idを
  // 送らない(サーバー側は送られなかった項目を今の値のまま変更しない)。
  if (voiceASelect.value) body.voice_a_id = voiceASelect.value;
  if (voiceBSelect.value) body.voice_b_id = voiceBSelect.value;

  const res = await fetch("/profile/data", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (res.ok) {
    savedEl.style.display = "block";
  } else {
    saveErrorEl.style.display = "block";
  }
});

load();
</script>
</body>
</html>
