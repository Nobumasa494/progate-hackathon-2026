<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>新規登録 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .authwrap{max-width:380px;margin:80px auto;padding:0 24px;}
  .authcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px 28px;}
  .authcard h1{margin:0 0 6px;}
  .authcard .sub{margin:0 0 24px;}
  .authcard .input{width:100%;margin-bottom:14px;}
  .authcard .btn{width:100%;}
  .switch{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-dim);}
</style>
</head>
<body>
<div class="authwrap">
  <div class="authcard">
    <div class="eyebrow" style="color:var(--recipe)">置き換えダイエット</div>
    <h1>新規登録</h1>
    <p class="sub">メールアドレスとパスワード(6文字以上)を入力してください</p>

    <input class="input" id="email" type="email" placeholder="メールアドレス">
    <input class="input" id="password" type="password" placeholder="パスワード">
    <input class="input" id="favorite-things" type="text" placeholder="好きなこと(任意・例: 映画鑑賞)">
    <button class="btn" id="signup-btn" style="background:var(--recipe);color:#fff;">登録する</button>

    <p id="error" class="error" style="display:none;margin-top:12px;"></p>
    <p id="notice" class="sub" style="display:none;margin-top:12px;">確認メールを送りました。メール内のリンクを開いてから、ログインしてください。</p>

    <div class="switch">すでにアカウントがある方は <a href="/login">ログイン</a></div>
  </div>
</div>

<script>
document.getElementById("signup-btn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const favoriteThings = document.getElementById("favorite-things").value.trim();
  const errorEl = document.getElementById("error");
  const noticeEl = document.getElementById("notice");
  errorEl.style.display = "none";
  noticeEl.style.display = "none";

  if (!email || !password) return;

  const res = await fetch("/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, favorite_things: favoriteThings }),
  });

  if (res.ok) {
    window.location.href = "/";
  } else {
    const data = await res.json();
    if (data.error && data.error.includes("confirm")) {
      noticeEl.style.display = "block";
    } else {
      errorEl.textContent = data.error || "登録に失敗しました";
      errorEl.style.display = "block";
    }
  }
});
</script>
</body>
</html>
