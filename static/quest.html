<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探すクエスト - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  #map { width: 100%; height: 320px; border-radius: 16px; margin-bottom: 16px; background: var(--surface-2); }
  .report-form label { font-size: 13px; color: var(--ink-dim); font-weight: 700; margin-bottom: 6px; display: block; }
  .report-form .input, .report-form input[type="file"] { margin-bottom: 14px; }

  .header-area{position:relative;padding-right:78px;min-height:76px;}
  .mascot-zebra{
    position:absolute;right:-10px;top:-30px;width:60px;height:auto;
    animation:mascot-float 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.15));
  }
  @keyframes mascot-float{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-10px) rotate(2deg);}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2a6 6 0 0 1 6 6c0 4-6 10-6 10S3 12 3 8a6 6 0 0 1 6-6Z"/><circle cx="9" cy="8" r="2"/></svg>
    </div>
    <div class="appbar-title">探すクエスト</div>
  </div>

  <div class="header-area">
    <img class="mascot-zebra" src="images/zebra.png" alt="シマウマのアイコン">
    <h1 id="quest-title">この食材を探しに行こう</h1>
    <p class="sub" id="quest-sub">近くのスーパーで見つけたら、写真を撮って報告しよう</p>
  </div>

  <div class="card">
    <div id="map"></div>
    <p class="sub" style="margin:8px 0 4px;">地図をタップするか、下から近くのお店を選ぶと、発見報告のピンの位置を指定できます</p>
    <div id="nearby-store-wrap" style="display:none;margin-top:4px;">
      <label style="font-size:13px;color:var(--ink-dim);font-weight:700;margin-bottom:6px;display:block;">近くのお店から選ぶ</label>
      <select class="input" id="nearby-store-select" style="width:100%;">
        <option value="">選択してください</option>
      </select>
    </div>
    <a id="open-in-maps" class="btn btn-ghost" style="width:100%;display:block;text-align:center;text-decoration:none;margin-top:14px;" target="_blank">地図アプリで近くのスーパーを探す</a>
  </div>

  <div class="card">
    <h3 class="sec" style="margin-top:0;">発見を報告する</h3>
    <div class="report-form">
      <div id="dish-select-wrap" style="display:none;">
        <label>見つけた食材(複数選択可)</label>
        <div id="dish-select" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;"></div>
      </div>

      <label>お店の名前</label>
      <input class="input" id="store-name" type="text" placeholder="例: イオン渋谷店">

      <label>証拠の写真</label>
      <input type="file" id="photo" accept="image/*" capture="environment">

      <label>コメント(任意)</label>
      <input class="input" id="comment" type="text" placeholder="例: 入口すぐの棚にありました">

      <button class="btn ai-glow-btn" id="report-btn" style="width:100%;">発見を報告する</button>
      <p id="report-message" class="sub mt-2" style="display:none;"></p>
    </div>
  </div>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>
renderNav("recipe");

const params = new URLSearchParams(window.location.search);
const dishNames = params.getAll("dish_name").length > 0 ? params.getAll("dish_name") : ["オートミール"];
document.getElementById("quest-title").textContent =
  dishNames.map((n) => `「${n}」`).join("") + "を探しに行こう";

const foundDishes = new Set();

if (dishNames.length > 1) {
  const wrap = document.getElementById("dish-select-wrap");
  const select = document.getElementById("dish-select");
  dishNames.forEach((name) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "btn btn-ghost";
    chip.textContent = name;
    chip.style.padding = "10px 16px";
    chip.style.fontSize = "13px";
    chip.addEventListener("click", () => {
      if (foundDishes.has(name)) {
        foundDishes.delete(name);
        chip.classList.remove("btn");
        chip.classList.add("btn-ghost");
      } else {
        foundDishes.add(name);
        chip.classList.remove("btn-ghost");
        chip.classList.add("btn");
      }
    });
    select.appendChild(chip);
  });
  wrap.style.display = "block";
}

let currentLat = null;
let currentLng = null;

// 発見報告を登録する位置(初期値は現在地。地図クリックで上書きできる)
let reportLat = null;
let reportLng = null;
let reportMarker = null;

function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve({ lat: 35.681236, lng: 139.767125 }); // 取得できない場合は東京駅をデフォルトに
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve({ lat: 35.681236, lng: 139.767125 }),
    );
  });
}

async function loadMapsScript() {
  const res = await fetch("/maps-key");
  const data = await res.json();
  return new Promise((resolve) => {
    const script = document.createElement("script");
    script.src = `https://maps.googleapis.com/maps/api/js?key=${data.key}&libraries=places&callback=initMap`;
    window.initMap = resolve;
    document.head.appendChild(script);
  });
}

async function loadDiscoveries(map, currentPosition) {
  const results = await Promise.all(
    dishNames.map(async (name) => {
      const res = await fetch(`/discoveries?dish_name=${encodeURIComponent(name)}`);
      const data = await res.json();
      return data.map((d) => ({ ...d, dish_name: name }));
    }),
  );
  const discoveries = results.flat();

  // 現在地から離れた場所の投稿でも画面外に隠れないよう、現在地+全ピンが
  // 収まるようにズーム・中心位置を自動調整する
  const bounds = new google.maps.LatLngBounds();
  bounds.extend(currentPosition);

  // ピンが密集しても見やすいよう、マーカークラスタリング用の簡易グルーピング
  // (件数が少ないうちは1つずつ、増えてきたら@googlemaps/markerclustererの導入を検討)
  const escapeHtml = (s) =>
    s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const infoWindow = new google.maps.InfoWindow();
  discoveries.forEach((d) => {
    const position = { lat: d.lat, lng: d.lng };
    const marker = new google.maps.Marker({ position, map, title: d.store_name });
    marker.addListener("click", () => {
      const commentHtml = d.comment
        ? `<div style="margin-top:6px;font-size:13px;color:#555;">${escapeHtml(d.comment)}</div>`
        : "";
      const dishTag = dishNames.length > 1
        ? `<div style="font-size:11px;color:#888;margin-bottom:2px;">${escapeHtml(d.dish_name)}</div>`
        : "";
      const pioneerTag = d.is_pioneer
        ? `<div style="font-size:12px;color:#b8860b;margin-bottom:2px;">🏆 開拓者</div>`
        : "";
      infoWindow.setContent(`
        <div style="max-width:180px;">
          ${dishTag}
          ${pioneerTag}
          <div style="font-weight:700;margin-bottom:6px;">${escapeHtml(d.store_name)}</div>
          <img src="${d.photo_url}" style="width:100%;border-radius:8px;" alt="発見報告の写真">
          ${commentHtml}
        </div>
      `);
      infoWindow.open(map, marker);
    });
    bounds.extend(position);
  });

  if (discoveries.length > 0) {
    map.fitBounds(bounds);
  }
}

async function searchNearbySupermarkets(position) {
  try {
    const { Place } = await google.maps.importLibrary("places");
    const { places } = await Place.searchNearby({
      fields: ["displayName", "location", "id"],
      locationRestriction: { center: position, radius: 10000 },
      includedPrimaryTypes: ["supermarket"],
      maxResultCount: 20,
    });
    return places || [];
  } catch (err) {
    console.error("近くのスーパー検索に失敗しました", err);
    return [];
  }
}

function renderNearbyStores(map, stores) {
  console.log(`近くのスーパー: ${stores.length}件見つかりました`, stores);
  if (stores.length === 0) return;

  document.getElementById("nearby-store-wrap").style.display = "block";
  const select = document.getElementById("nearby-store-select");

  const selectStore = (store) => {
    reportLat = store.location.lat();
    reportLng = store.location.lng();
    reportMarker.setPosition(store.location);
    document.getElementById("store-name").value = store.displayName;
    select.value = store.id;
  };

  stores.forEach((store) => {
    const opt = document.createElement("option");
    opt.value = store.id;
    opt.textContent = store.displayName;
    select.appendChild(opt);

    const marker = new google.maps.Marker({
      position: store.location,
      map,
      title: store.displayName,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 6,
        fillColor: "#9aa0a6",
        fillOpacity: 1,
        strokeColor: "#ffffff",
        strokeWeight: 1,
      },
    });
    marker.addListener("click", () => selectStore(store));
  });

  select.addEventListener("change", () => {
    const store = stores.find((s) => s.id === select.value);
    if (store) selectStore(store);
  });
}

async function initApp() {
  const { lat, lng } = await getLocation();
  currentLat = lat;
  currentLng = lng;

  document.getElementById("open-in-maps").href =
    `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("スーパー")}&center=${lat},${lng}`;

  await loadMapsScript();

  const map = new google.maps.Map(document.getElementById("map"), {
    center: { lat, lng },
    zoom: 14,
  });
  new google.maps.Marker({
    position: { lat, lng },
    map,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 8,
      fillColor: "#4285F4",
      fillOpacity: 1,
      strokeColor: "#ffffff",
      strokeWeight: 2,
    },
  });

  reportLat = lat;
  reportLng = lng;
  reportMarker = new google.maps.Marker({
    position: { lat, lng },
    map,
    draggable: true,
    icon: { url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png" },
  });
  reportMarker.addListener("dragend", () => {
    const pos = reportMarker.getPosition();
    reportLat = pos.lat();
    reportLng = pos.lng();
  });
  map.addListener("click", (e) => {
    reportLat = e.latLng.lat();
    reportLng = e.latLng.lng();
    reportMarker.setPosition(e.latLng);
  });

  await loadDiscoveries(map, { lat, lng });

  const nearbyStores = await searchNearbySupermarkets({ lat, lng });
  renderNearbyStores(map, nearbyStores);
}

document.getElementById("report-btn").addEventListener("click", async () => {
  const storeName = document.getElementById("store-name").value.trim();
  const photoInput = document.getElementById("photo");
  const messageEl = document.getElementById("report-message");

  const reportDishNames = dishNames.length > 1 ? [...foundDishes] : dishNames;

  if (!storeName || !photoInput.files[0] || reportDishNames.length === 0) {
    messageEl.textContent = dishNames.length > 1
      ? "お店の名前・写真・見つけた食材(1つ以上)を入力してください。"
      : "お店の名前と写真の両方を入力してください。";
    messageEl.style.display = "block";
    return;
  }

  const comment = document.getElementById("comment").value.trim();

  const formData = new FormData();
  reportDishNames.forEach((name) => formData.append("dish_name", name));
  formData.append("store_name", storeName);
  formData.append("lat", reportLat);
  formData.append("lng", reportLng);
  formData.append("photo", photoInput.files[0]);
  if (comment) formData.append("comment", comment);

  const res = await fetch("/discoveries", { method: "POST", body: formData });
  if (res.ok) {
    const saved = await res.json();
    const gotPioneer = saved.some((d) => d.is_pioneer);
    messageEl.textContent = gotPioneer
      ? "発見を報告しました!🏆 開拓者バッジ獲得(この店は初報告です)"
      : "発見を報告しました!ありがとうございます。";
    document.getElementById("store-name").value = "";
    document.getElementById("comment").value = "";
    photoInput.value = "";
    foundDishes.clear();
    document.querySelectorAll("#dish-select .btn").forEach((chip) => {
      chip.classList.remove("btn");
      chip.classList.add("btn-ghost");
    });
  } else {
    messageEl.textContent = "報告に失敗しました。";
  }
  messageEl.style.display = "block";
});

initApp();
</script>
</body>
</html>
