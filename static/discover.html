<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなのラジオ - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  body{font-family:'Zen Kaku Gothic New',sans-serif;}
  .swipe-card{touch-action:pan-y;position:relative;}
  .swipe-hint{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .swipe-hint button{border:none;background:none;color:var(--ink-dim);font-size:18px;line-height:1;padding:0 4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="navbar" id="nav"></div>

  <div style="background:rgba(255,255,255,0.7);border-radius:16px;padding:10px 12px;margin-bottom:14px;">
    <h1 style="margin-bottom:6px;">みんなのラジオ</h1>
    <p class="sub" style="margin-bottom:0;">みんなが「共有する」を選んだ回が、匿名で流れてきます(投稿者は分かりません)</p>
  </div>

  <div id="swipe-tip" class="card border-0 bg-light mb-3" style="display:none;">
    <div class="card-body py-2 swipe-hint">
      <span class="small text-secondary">聞き終えたら、カードを左右にスワイプすると自分の画面から消せます</span>
      <button id="swipe-tip-close" aria-label="閉じる">&times;</button>
    </div>
  </div>

  <div id="feed"></div>
  <p id="loading" class="text-secondary small text-center py-3" style="background:rgba(255,255,255,0.7);border-radius:12px;">読み込み中...</p>
  <p id="no-more" class="text-secondary small text-center py-3" style="display:none;background:rgba(255,255,255,0.7);border-radius:12px;">これ以上ありません</p>
</div>

<script src="nav.js"></script>
<script>
renderNav("radio");

const feedEl = document.getElementById("feed");
const loadingEl = document.getElementById("loading");
const noMoreEl = document.getElementById("no-more");
const swipeTipEl = document.getElementById("swipe-tip");

let cursor = null;
let loading = false;
let done = false;
let currentlyPlaying = null;

// 上から順番に自動再生していくための、再生済み順のリスト
const episodeAudios = [];

function playNext(finishedAudio) {
  const idx = episodeAudios.indexOf(finishedAudio);
  const next = episodeAudios[idx + 1];
  if (next) {
    next.scrollIntoView({ behavior: "smooth", block: "center" });
    if (currentlyPlaying && currentlyPlaying !== next) currentlyPlaying.pause();
    next.play().catch(() => {});
    currentlyPlaying = next;
  } else if (!done) {
    // まだ次が読み込まれていない場合は、読み込んでから改めて次に進む
    loadMore().then(() => playNext(finishedAudio));
  }
}

// 「消す」はサーバーには送らず、このブラウザだけで覚えておく(他の人には見え続ける)。
const DISMISSED_KEY = "discover_dismissed_episode_ids";

function loadDismissedIds() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY) || "[]"));
  } catch (e) {
    return new Set();
  }
}

function dismissEpisode(id) {
  try {
    const ids = loadDismissedIds();
    ids.add(id);
    // 際限なく増えないよう、直近500件だけ残す
    localStorage.setItem(DISMISSED_KEY, JSON.stringify(Array.from(ids).slice(-500)));
  } catch (e) {
    // localStorageが使えない環境(プライベートモード等)でも失敗させない
  }
}

const dismissedIds = loadDismissedIds();

try {
  if (!localStorage.getItem("discover_swipe_tip_seen")) {
    swipeTipEl.style.display = "block";
  }
} catch (e) {}

document.getElementById("swipe-tip-close").addEventListener("click", () => {
  swipeTipEl.style.display = "none";
  try { localStorage.setItem("discover_swipe_tip_seen", "1"); } catch (e) {}
});

// カードを左右にドラッグし、一定距離を超えたら「消す」扱いにする(スワイプ操作)。
// audio(再生バーの操作)・details(台本の開閉)の上から始まったドラッグは無視する。
function attachSwipeToDismiss(card, audio, episodeId) {
  let startX = 0;
  let dx = 0;
  let dragging = false;
  const threshold = 90;

  card.addEventListener("pointerdown", (e) => {
    if (e.target.closest("audio") || e.target.closest("details")) return;
    dragging = true;
    startX = e.clientX;
    card.style.transition = "none";
    card.setPointerCapture(e.pointerId);
  });

  card.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    card.style.transform = `translateX(${dx}px)`;
    card.style.opacity = String(Math.max(0.15, 1 - Math.abs(dx) / 280));
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    card.style.transition = "transform .2s ease, opacity .2s ease";
    if (Math.abs(dx) > threshold) {
      const dir = dx > 0 ? 1 : -1;
      card.style.transform = `translateX(${dir * 600}px)`;
      card.style.opacity = "0";
      const wasPlaying = currentlyPlaying === audio;
      audio.pause();
      if (wasPlaying) currentlyPlaying = null;
      if (wasPlaying) playNext(audio); // 再生中の回を消したら、続けて次の回に進む
      const idx = episodeAudios.indexOf(audio);
      if (idx !== -1) episodeAudios.splice(idx, 1);
      dismissEpisode(episodeId);
      setTimeout(() => card.remove(), 200);
    } else {
      card.style.transform = "translateX(0)";
      card.style.opacity = "1";
    }
    dx = 0;
  }

  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);
}

function renderEpisode(ep) {
  // 台本(ep.script)には、他ユーザーが自由入力した文章(今日のメモ等)が混ざりうるため、
  // innerHTMLでの直接埋め込みはせず、textContentで安全に挿入する(XSS対策)。
  const card = document.createElement("div");
  card.className = "card shadow-sm border-0 mb-3 swipe-card";

  const body = document.createElement("div");
  body.className = "card-body";

  const nameEl = document.createElement("div");
  nameEl.className = "small fw-bold text-secondary mb-1";
  nameEl.textContent = ep.display_name;

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.className = "w-100 mb-2";
  audio.src = ep.audio_url;

  let commentEl = null;
  if (ep.comment) {
    commentEl = document.createElement("p");
    commentEl.className = "small mb-2";
    commentEl.textContent = ep.comment;
  }

  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.className = "small text-secondary";
  summary.style.cursor = "pointer";
  summary.textContent = "台本を見る";

  const scriptBox = document.createElement("div");
  scriptBox.className = "bg-light rounded p-3 small text-secondary mt-2";
  scriptBox.style.whiteSpace = "pre-wrap";
  scriptBox.style.maxHeight = "200px";
  scriptBox.style.overflowY = "auto";
  scriptBox.textContent = ep.script;

  details.appendChild(summary);
  details.appendChild(scriptBox);
  body.appendChild(nameEl);
  body.appendChild(audio);
  if (commentEl) body.appendChild(commentEl);
  body.appendChild(details);
  card.appendChild(body);
  feedEl.appendChild(card);
  attachSwipeToDismiss(card, audio, ep.id);
  episodeAudios.push(audio);
  audio.addEventListener("ended", () => playNext(audio));

  // 一番最初の1件だけ、読み込み時に自動再生を試みる(以降はplayNextで順送り)。
  // ブラウザの自動再生ポリシーにより、ユーザー操作前だとブロックされることがある
  // (その場合はcatchで静かに諦め、再生ボタンでの手動再生に任せる)。
  if (episodeAudios.length === 1) {
    audio.play().then(() => { currentlyPlaying = audio; }).catch(() => {});
  }
}

async function loadMore() {
  if (loading || done) return;
  loading = true;
  loadingEl.style.display = "block";

  const url = cursor ? `/discover/feed?before=${encodeURIComponent(cursor)}` : "/discover/feed";
  const res = await fetch(url);
  const data = await res.json();

  if (data.episodes.length === 0) {
    done = true;
    loadingEl.style.display = "none";
    noMoreEl.style.display = "block";
    loading = false;
    return;
  }

  let renderedCount = 0;
  data.episodes.forEach((ep) => {
    if (dismissedIds.has(ep.id)) return; // 以前このブラウザで「消した」回はそもそも表示しない
    renderEpisode(ep);
    renderedCount++;
  });
  cursor = data.episodes[data.episodes.length - 1].created_at;
  loadingEl.style.display = "none";
  loading = false;

  // このページが全部「消し済み」だった場合、画面が空のままにならないよう続けて次を読み込む
  if (renderedCount === 0) {
    loadMore();
  }
}

// 無限スクロール: ページの下端に近づいたら次のページを読み込む
window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
    loadMore();
  }
});

loadMore();
</script>
</body>
</html>
