<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ホーム - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .promo-card{
    background:var(--ai-gradient);color:#fff;border-radius:22px;padding:24px 22px;margin-bottom:22px;
    position:relative;overflow:hidden;box-shadow:0 14px 30px -12px rgba(46,125,79,0.5);
  }
  .promo-card::after{
    content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .promo-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);
    padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:10px;}
  .promo-title{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:19px;margin-bottom:6px;}
  .promo-desc{font-size:13px;opacity:0.92;margin-bottom:16px;}
  .promo-btn{background:#fff;color:var(--primary-dark);border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;}

  .menu-row{
    display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;margin-bottom:12px;text-decoration:none;color:var(--ink);
  }
  .menu-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-bg);color:var(--primary);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .menu-title{font-weight:700;font-size:14px;}
  .menu-desc{font-size:12px;color:var(--ink-dim);}
  .menu-chevron{margin-left:auto;color:var(--ink-dim);flex:0 0 auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9h14a7 7 0 0 1-14 0Z"/><path d="M6 9c0-2 .5-3.5 1.5-4.5M13.5 4.5C14.5 5.5 15 7 15 9"/></svg>
    </div>
    <div class="appbar-title">かるレシピ</div>
  </div>
  <p class="sub">食べたいを、我慢しない。</p>

  <a href="/recipe" style="text-decoration:none;">
    <div class="promo-card">
      <div class="promo-badge">
        <svg class="sparkle" width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2l1.6 5.4L17 9l-5.4 1.6L10 16l-1.6-5.4L3 9l5.4-1.6Z"/></svg>
        AI低糖質提案
      </div>
      <div class="promo-title">置き換えレシピで無理なくダイエット</div>
      <div class="promo-desc">お気に入りの高カロリー料理を、ヘルシーにアレンジします。</div>
      <span class="promo-btn">
        今日の料理を提案してもらう
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
      </span>
    </div>
  </a>

  <a href="/recipe" class="menu-row">
    <div class="menu-icon"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 18 18"/></svg></div>
    <div>
      <div class="menu-title">料理名を入力 → レシピ提案</div>
      <div class="menu-desc">AIが低カロリーな代替レシピを提案</div>
    </div>
    <svg class="menu-chevron" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5l5 5-5 5"/></svg>
  </a>

  <a href="/weight-log" class="menu-row">
    <div class="menu-icon"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13l4-3 3 2 6-7"/><circle cx="16" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg></div>
    <div>
      <div class="menu-title">体重記録</div>
      <div class="menu-desc">日々の体重を記録して推移を確認</div>
    </div>
    <svg class="menu-chevron" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5l5 5-5 5"/></svg>
  </a>

  <a href="/goals" class="menu-row">
    <div class="menu-icon"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.6"/></svg></div>
    <div>
      <div class="menu-title">目標設定</div>
      <div class="menu-desc">目標体重と期日を設定してモチベ維持</div>
    </div>
    <svg class="menu-chevron" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5l5 5-5 5"/></svg>
  </a>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>renderNav("home");</script>
</body>
</html>
