<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホーム - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<style>
  .promo-card{
    background:var(--ai-gradient);color:#fff;border-radius:22px;padding:24px 22px;margin-bottom:22px;
    position:relative;overflow:hidden;box-shadow:0 14px 30px -12px rgba(115,87,196,0.5);
  }
  .promo-card::after{
    content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .promo-fox{
    position:absolute;right:0px;bottom:10px;width:88px;height:auto;
    animation:mascot-float 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.18));
  }
  @keyframes mascot-float{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-10px) rotate(2deg);}
  }
  .promo-title{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:19px;margin-bottom:6px;padding-right:80px;}
  .promo-desc{font-size:13px;opacity:0.92;margin-bottom:16px;padding-right:80px;}
  .promo-btn{background:#fff;color:var(--primary-dark);border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;}

  .menu-row{
    display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;margin-bottom:12px;text-decoration:none;color:var(--ink);
  }
  .menu-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-bg);color:var(--primary);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .menu-title{font-weight:700;font-size:14px;}
  .menu-desc{font-size:12px;color:var(--ink-dim);}
  .menu-chevron{margin-left:auto;color:var(--ink-dim);flex:0 0 auto;}


</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon" style="padding:0;overflow:hidden;">
      <img src="images/app-icon.png" alt="アプリアイコン" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="appbar-title">おきかえレシピ</div>
  </div>
  <p class="sub">食べたいを、我慢しない。</p>

  <a href="/recipe" style="text-decoration:none;">
    <div class="promo-card">
      <img class="promo-fox" src="images/fox.png" alt="きつねのフォクシー">
      <div class="promo-title">置き換えレシピで無理なくダイエット</div>
      <div class="promo-desc">お気に入りの高カロリー料理を、ヘルシーにアレンジします。</div>
      <span class="promo-btn">
        今日の料理を提案してもらう
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
      </span>
    </div>
  </a>

  <a href="/recipe" class="menu-row">
    <div class="menu-icon" style="padding:0;overflow:hidden;"><img src="images/nav/recipe.png" alt="パンダのアイコン" style="width:100%;height:100%;object-fit:cover;"></div>
    <div>
      <div class="menu-title">料理名を入力 → レシピ提案</div>
      <div class="menu-desc">AIが低カロリーな代替レシピを提案</div>
    </div>
    <svg class="menu-chevron" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5l5 5-5 5"/></svg>
  </a>

  <a href="/goals" class="menu-row">
    <div class="menu-icon" style="padding:0;overflow:hidden;"><img src="images/nav/goal.png" alt="くまのアイコン" style="width:100%;height:100%;object-fit:cover;"></div>
    <div>
      <div class="menu-title">目標設定・体重記録</div>
      <div class="menu-desc">目標体重と期日を設定、日々の体重も記録</div>
    </div>
    <svg class="menu-chevron" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5l5 5-5 5"/></svg>
  </a>

  <a href="/radio" class="menu-row">
    <div class="menu-icon" style="padding:0;overflow:hidden;"><img src="images/nav/radio.png" alt="パンダのアイコン" style="width:100%;height:100%;object-fit:cover;"></div>
    <div>
      <div class="menu-title">深夜ラジオ・みんなのエピソード</div>
      <div class="menu-desc">今日の記録をもとにDJが実況、共有エピソードも聴ける</div>
    </div>
    <svg class="menu-chevron" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5l5 5-5 5"/></svg>
  </a>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>renderNav("home");</script>
</body>
</html>
