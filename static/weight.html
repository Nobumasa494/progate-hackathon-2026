<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体重記録 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .chart-box{position:relative;height:220px;}
  .today-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
  .today-value{font-family:'Zen Maru Gothic',sans-serif;font-weight:800;font-size:34px;color:var(--primary-dark);}
  .today-value span{font-size:16px;font-weight:600;color:var(--ink-dim);}
  .history-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .history-row:last-child{border-bottom:none;}
  .history-date{color:var(--ink-dim);}
  .history-weight{font-weight:700;}
  .history-delta{font-weight:700;font-size:13px;}
  .history-delta.down{color:var(--down);}
  .history-delta.up{color:var(--up);}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13l4-3 3 2 6-7"/><circle cx="16" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="appbar-title">体重記録</div>
  </div>

  <p class="sub">毎日の記録が、目標画面の計算に自動で使われます</p>

  <div class="card">
    <div class="today-row">
      <div class="today-value" id="today-value">--<span>kg</span></div>
      <div class="inputrow" style="margin:0;">
        <input class="input" id="weight-input" type="number" step="0.1" placeholder="例: 65.0" style="max-width:110px;">
        <button class="btn" id="record-btn">記録する</button>
      </div>
    </div>
    <button class="btn btn-ghost" id="delete-btn" style="width:100%;">最新の記録を削除</button>
  </div>

  <div class="card">
    <h3 class="sec" style="margin-top:0;">推移</h3>
    <div class="chart-box">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="card">
    <h3 class="sec" style="margin-top:0;">最近の記録</h3>
    <div id="history"></div>
  </div>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>
renderNav("weight");

const input = document.getElementById("weight-input");
const button = document.getElementById("record-btn");
const deleteButton = document.getElementById("delete-btn");
const todayValueEl = document.getElementById("today-value");
const historyEl = document.getElementById("history");
let chart;

async function loadChart() {
  const res = await fetch("/weight");
  const logs = await res.json();
  const labels = logs.map(l => new Date(l.created_at).toLocaleDateString());
  const data = logs.map(l => l.weight_kg);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [{ label: "体重(kg)", data, borderColor: "#2e7d4f", backgroundColor: "#2e7d4f", borderWidth: 3, tension: 0.2 }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { labels: { usePointStyle: true, pointStyle: "line" } } },
    },
  });

  if (logs.length > 0) {
    todayValueEl.innerHTML = `${logs[logs.length - 1].weight_kg}<span>kg</span>`;
  }

  historyEl.innerHTML = "";
  const recent = logs.slice(-7).reverse();
  recent.forEach((log, i) => {
    const prev = recent[i + 1];
    const row = document.createElement("div");
    row.className = "history-row";

    const dateEl = document.createElement("span");
    dateEl.className = "history-date";
    dateEl.textContent = new Date(log.created_at).toLocaleDateString();

    const weightEl = document.createElement("span");
    weightEl.className = "history-weight";
    weightEl.textContent = `${log.weight_kg}kg`;

    row.appendChild(dateEl);
    row.appendChild(weightEl);

    if (prev) {
      const diff = Math.round((log.weight_kg - prev.weight_kg) * 10) / 10;
      const deltaEl = document.createElement("span");
      deltaEl.className = "history-delta " + (diff <= 0 ? "down" : "up");
      deltaEl.textContent = (diff > 0 ? "+" : "") + diff + "kg";
      row.appendChild(deltaEl);
    }

    historyEl.appendChild(row);
  });
}

async function record() {
  const weight = parseFloat(input.value);
  if (!weight) return;
  await fetch(`/weight?weight_kg=${weight}`, { method: "POST" });
  input.value = "";
  loadChart();
}

async function deleteLatest() {
  await fetch("/weight/latest", { method: "DELETE" });
  loadChart();
}

button.addEventListener("click", record);
deleteButton.addEventListener("click", deleteLatest);
loadChart();
</script>
</body>
</html>
