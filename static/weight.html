<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体重記録 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/app-icon.png">
<link rel="apple-touch-icon" href="images/app-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .chart-box{position:relative;height:220px;}
  .today-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
  /* 最近の記録: 4列固定グリッド。行ごとに要素数が変わって列がズレるのを防ぐ */
  .history-head,
  .history-row{
    display:grid;
    grid-template-columns:76px 1fr 1.4fr 72px;
    gap:8px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .history-head{
    padding-bottom:6px;
    font-size:11px;
    font-weight:700;
    color:var(--ink-dim);
    border-bottom:1.5px solid var(--border);
  }
  .history-row:last-child{border-bottom:none;}
  .history-head .c-weight,
  .history-row .c-weight{text-align:left;}
  .history-head .c-delta,
  .history-row .c-delta{text-align:right;}
  .history-date{color:var(--ink-dim);}
  .history-weight{font-weight:700;}
  .history-steps{color:var(--ink-dim);font-size:12px;line-height:1.3;}
  .history-steps b{display:block;font-size:13px;color:var(--ink);font-weight:700;}
  .history-delta{font-weight:700;font-size:13px;text-align:right;}
  .history-delta.down{color:var(--down);}
  .history-delta.up{color:var(--up);}
  .history-delta.none{color:var(--ink-dim);font-weight:400;}

  .header-area{position:relative;padding-right:78px;min-height:76px;background:rgba(255,255,255,0.7);border-radius:16px;padding-top:10px;padding-bottom:10px;margin-bottom:14px;}
  .header-area p{padding-left:12px;}
  .mascot-rabbit{
    position:absolute;right:-10px;top:-4px;width:68px;height:auto;
    animation:mascot-float 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,0.15));
  }
  @keyframes mascot-float{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-10px) rotate(2deg);}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="appbar-icon" style="padding:0;overflow:hidden;">
      <img src="images/rabbit.png" alt="うさぎのアイコン" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="appbar-title">体重記録</div>
  </div>

  <div class="header-area">
    <img class="mascot-rabbit" src="images/rabbit.png" alt="うさぎのバニー">
    <p class="sub">毎日の記録が、目標画面の計算に自動で使われます</p>
  </div>

  <div class="card">
    <div class="today-row">
      <div class="inputrow" style="margin:0;flex-wrap:wrap;">
        <input class="input" id="weight-date" type="date" style="max-width:150px;">
        <input class="input" id="weight-input" type="number" step="0.1" placeholder="例: 65.0" style="max-width:110px;">
        <input class="input" id="step-input" type="number" min="0" placeholder="歩数 (任意)" style="max-width:150px;">
        <button class="btn ai-glow-btn" id="record-btn">記録する</button>
      </div>
    </div>
    <button class="btn btn-ghost" id="delete-btn" style="width:100%;margin-top:10px;">選んだ日付の記録を削除</button>
  </div>

  <div class="card">
    <h3 class="sec" style="margin-top:0;">推移</h3>
    <div class="chart-box">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="card">
    <h3 class="sec" style="margin-top:0;">最近の記録</h3>
    <div class="history-head">
      <span>日付</span>
      <span class="c-weight">体重</span>
      <span>歩数</span>
      <span class="c-delta">前回比</span>
    </div>
    <div id="history"></div>
  </div>
</div>

<div class="navbar" id="nav"></div>

<script src="nav.js"></script>
<script>
renderNav("goal");

const dateInput = document.getElementById("weight-date");
const input = document.getElementById("weight-input");
const stepInput = document.getElementById("step-input");
const button = document.getElementById("record-btn");
const deleteButton = document.getElementById("delete-btn");
const historyEl = document.getElementById("history");
let chart;

async function loadChart() {
  const res = await fetch("/weight");
  const logs = await res.json();
  const labels = logs.map(l => new Date(l.created_at).toLocaleDateString());
  const data = logs.map(l => l.weight_kg);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [{ label: "体重(kg)", data, borderColor: "#2e7d4f", backgroundColor: "#2e7d4f", borderWidth: 3, tension: 0.2 }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { labels: { usePointStyle: true, pointStyle: "line" } } },
    },
  });

  if (logs.length > 0) {
    input.value = logs[logs.length - 1].weight_kg;
  }

  historyEl.innerHTML = "";
  const recent = logs.slice(-7).reverse();
  recent.forEach((log, i) => {
    const prev = recent[i + 1];
    const row = document.createElement("div");
    row.className = "history-row";

    const dateEl = document.createElement("span");
    dateEl.className = "history-date c-date";
    dateEl.textContent = new Date(log.created_at).toLocaleDateString();

    const weightEl = document.createElement("span");
    weightEl.className = "history-weight c-weight";
    weightEl.textContent = `${log.weight_kg}kg`;

    const stepCount = log.step_count || 0;
    const stepsEl = document.createElement("span");
    stepsEl.className = "history-steps c-steps";
    if (stepCount > 0) {
      const stepsB = document.createElement("b");
      stepsB.textContent = `${stepCount.toLocaleString()}歩`;
      const kcalSpan = document.createElement("span");
      kcalSpan.textContent = `約${Math.round(stepCount * log.weight_kg * 0.0004)}kcal`;
      stepsEl.appendChild(stepsB);
      stepsEl.appendChild(kcalSpan);
    } else {
      stepsEl.textContent = "未記録";
    }

    const deltaEl = document.createElement("span");
    deltaEl.className = "history-delta c-delta";
    if (prev) {
      const diff = Math.round((log.weight_kg - prev.weight_kg) * 10) / 10;
      deltaEl.classList.add(diff <= 0 ? "down" : "up");
      deltaEl.textContent = (diff > 0 ? "+" : "") + diff + "kg";
    } else {
      deltaEl.classList.add("none");
      deltaEl.textContent = "-";
    }

    row.appendChild(dateEl);
    row.appendChild(weightEl);
    row.appendChild(stepsEl);
    row.appendChild(deltaEl);

    historyEl.appendChild(row);
  });
}

async function record() {
  const weight = parseFloat(input.value);
  const logDate = dateInput.value;
  if (!weight || !logDate) return;
  let url = `/weight?weight_kg=${weight}&date=${logDate}`;
  const stepCount = stepInput.value.trim();
  if (stepCount !== "") {
    url += `&step_count=${stepCount}`;
  }
  await fetch(url, { method: "POST" });
  input.value = "";
  stepInput.value = "";
  loadChart();
  dateInput.value = new Date().toISOString().slice(0, 10);
}

async function deleteByDate() {
  const logDate = dateInput.value;
  if (!logDate) return;
  if (!confirm(`${logDate}の記録を削除しますか？`)) return;
  await fetch(`/weight?date=${logDate}`, { method: "DELETE" });
  loadChart();
}

button.addEventListener("click", record);
deleteButton.addEventListener("click", deleteByDate);
loadChart();
</script>
</body>
</html>
