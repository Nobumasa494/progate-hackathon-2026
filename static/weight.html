<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>体重記録 - 置き換えダイエット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .chart-box{position:relative;height:280px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="navbar" id="nav"></div>

  <div class="eyebrow" style="color:var(--weight)">体重記録</div>
  <h1>体重を記録</h1>
  <p class="sub">毎日の記録が、目標画面の計算に自動で使われます</p>

  <div class="card">
    <div class="inputrow">
      <input class="input" id="weight-input" type="number" step="0.1" placeholder="例: 65.0" style="max-width:160px;">
      <button class="btn" id="record-btn" style="background:var(--weight);color:#fff;">記録する</button>
    </div>
    <button class="btn btn-ghost" id="delete-btn">最新の記録を削除</button>
  </div>

  <div class="card">
    <div class="chart-box">
      <canvas id="chart"></canvas>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script>
renderNav("weight");

const input = document.getElementById("weight-input");
const button = document.getElementById("record-btn");
const deleteButton = document.getElementById("delete-btn");
let chart;

async function loadChart() {
  const res = await fetch(`/weight?user_id=${encodeURIComponent(USER_ID)}`);
  const logs = await res.json();
  const labels = logs.map(l => new Date(l.created_at).toLocaleDateString());
  const data = logs.map(l => l.weight_kg);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [{ label: "体重(kg)", data, borderColor: "#a06635", backgroundColor: "#a06635", borderWidth: 3, tension: 0.2 }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { labels: { usePointStyle: true, pointStyle: "line" } } },
    },
  });
}

async function record() {
  const weight = parseFloat(input.value);
  if (!weight) return;
  await fetch(`/weight?user_id=${encodeURIComponent(USER_ID)}&weight_kg=${weight}`, { method: "POST" });
  input.value = "";
  loadChart();
}

async function deleteLatest() {
  await fetch(`/weight/latest?user_id=${encodeURIComponent(USER_ID)}`, { method: "DELETE" });
  loadChart();
}

button.addEventListener("click", record);
deleteButton.addEventListener("click", deleteLatest);
loadChart();
</script>
</body>
</html>
